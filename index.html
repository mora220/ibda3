        const firebaseConfig = {
            apiKey: "AIzaSyDwSZe5sUglFRmXKbGLqtS6_5qO1r5wf9o",
            authDomain: "ibda3-91fde.firebaseapp.com",

            storageBucket: "ibda3-91fde.firebasestorage.app",
            messagingSenderId: "203097189746",
            appId: "1:203097189746:web:af3a59c8eee851663881eb"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);

        window.firebaseAPI = {

<body class="bg-slate-100 text-gray-800 antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
            doc, setDoc, getDoc, updateDoc, collection, addDoc, deleteDoc, onSnapshot, query, orderBy, limit 
        } = window.firebaseAPI;

        const getEmbedUrl = (url) => {
            if (!url) return "";
            try {
                if (url.includes("youtube.com/watch")) {
                    const v = new URL(url).searchParams.get("v");
                    return v ? `https://www.youtube.com/embed/${v}` : url;
                }
                if (url.includes("youtu.be/")) {
                    const v = url.split("youtu.be/")[1]?.split("?")[0];
                    return v ? `https://www.youtube.com/embed/${v}` : url;
                }
            } catch (e) { return url; }
            return url; 
        };

        // --- خوارزمية ضغط الصور لحل مشكلة الحفظ ---
        const handleImageUpload = (e, callback) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const MAX_WIDTH = 800; // تقليص العرض
                    const MAX_HEIGHT = 800; // تقليص الطول
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    // تحويلها لـ JPEG بجودة 70% لتقليل الحجم جداً
                    const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
                    callback(dataUrl);
                };
            };
        };

        function App() {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(window.auth, async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        try {
                            const userDoc = await getDoc(doc(window.db, "users", currentUser.uid));
                            if (userDoc.exists()) setRole(userDoc.data().role);
                            else setRole("student");
                        } catch (error) { setRole("student"); }
                    } else { setRole(null); }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50">
                    <i className="fa-solid fa-circle-notch fa-spin text-primary text-5xl mb-4"></i>
                    <h2 className="text-xl font-bold text-gray-700 animate-pulse">جاري تحميل منصة إبداع...</h2>
                </div>
            );

            if (!user) return <Login />;
            if (role === "super_admin" || role === "admin") return <AdminDashboard user={user} role={role} />;
            return <StudentDashboard user={user} />;
        }

        // --- صفحة الدخول الاحترافية ---
        function Login() {
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(""); setLoading(true);
                const email = username.trim().toLowerCase() + "@ebdaa.com";

                try {
                    if (isRegister) {
                        if (password.length < 6) { setError("كلمة المرور يجب ألا تقل عن 6 أحرف"); setLoading(false); return; }
                        const userCredential = await createUserWithEmailAndPassword(window.auth, email, password);
                        await setDoc(doc(window.db, "users", userCredential.user.uid), {
                            username: username.trim(), role: "student", profileComplete: false, createdAt: new Date().toISOString()
                        });
                    } else {
                        await signInWithEmailAndPassword(window.auth, email, password);
                    }
                } catch (err) { setError("بيانات الدخول غير صحيحة أو الحساب مسجل مسبقاً."); }
                setLoading(false);
            };

            return (
                <div className="flex min-h-screen bg-slate-100">
                    <div className="hidden lg:flex w-1/2 bg-gradient-to-br from-primary to-secondary text-white flex-col justify-center items-center p-12 relative overflow-hidden">
                        <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-white opacity-10 rounded-full blur-3xl"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-accent opacity-20 rounded-full blur-3xl"></div>
                        <img src="https://i.ibb.co/3m1R0Vb/image.png" className="w-32 h-32 object-cover rounded-full border-4 border-white/30 shadow-2xl mb-8 z-10" />
                        <h1 className="text-5xl font-black mb-4 z-10 text-center leading-tight">بوابتك نحو التميز<br/>والإبداع</h1>
                        <p className="text-lg text-indigo-100 z-10 text-center max-w-md">انضم إلى آلاف الطلاب في منصة إبداع التعليمية واستمتع بتجربة تعلم فريدة ومحتوى حصري.</p>
                    </div>
                    <div className="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12 relative">
                        <div className="w-full max-w-md bg-white p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100">
                            <div className="text-center mb-8">
                                <img src="https://i.ibb.co/3m1R0Vb/image.png" className="w-16 h-16 object-cover rounded-full mx-auto mb-4 lg:hidden border-2 border-primary" />
                                <h2 className="text-2xl font-bold text-gray-900">{isRegister ? "إنشاء حساب جديد" : "تسجيل الدخول"}</h2>
                                <p className="text-sm text-gray-500 mt-1">مرحباً بك مجدداً في منصة إبداع</p>
                            </div>

                            {error && <div className="bg-red-50 text-red-600 p-3 rounded-xl text-sm font-bold mb-6 flex items-center gap-2"><i className="fa-solid fa-circle-exclamation"></i>{error}</div>}
                            
                            <form onSubmit={handleSubmit} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5"><i className="fa-solid fa-user text-gray-400 ml-1"></i> اسم المستخدم</label>
                                    <input type="text" required value={username} onChange={(e) => setUsername(e.target.value)} className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="ادخل اسم المستخدم" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5"><i className="fa-solid fa-lock text-gray-400 ml-1"></i> كلمة المرور</label>
                                    <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="••••••••" />
                                </div>
                                <button type="submit" disabled={loading} className="w-full bg-gradient-to-r from-primary to-secondary text-white py-3.5 rounded-xl font-bold text-lg hover:shadow-lg hover:opacity-90 transition-all transform hover:-translate-y-0.5">
                                    {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : (isRegister ? "إنشاء الحساب" : "دخول المنصة")}
                                </button>
                            </form>
                            <div className="mt-8 text-center">
                                <button onClick={() => { setIsRegister(!isRegister); setError(""); }} className="text-sm font-bold text-primary hover:text-secondary transition-colors">
                                    {isRegister ? "لديك حساب بالفعل؟ سجل دخولك" : "ليس لديك حساب؟ أنشئ حساباً جديداً"}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- لوحة الإدارة الاحترافية ---
        function AdminDashboard({ user, role }) {
            const [activeSubTab, setActiveSubTab] = useState("courses");
            const [courses, setCourses] = useState([]);
            const [requests, setRequests] = useState([]);
            const [students, setStudents] = useState([]);
            const [promos, setPromos] = useState([]);
            const [socialLinks, setSocialLinks] = useState([]);
            
            const [selectedCourseForLectures, setSelectedCourseForLectures] = useState(null);
            const [viewingStudentModal, setViewingStudentModal] = useState(null);
            const [chatPreselectedStudent, setChatPreselectedStudent] = useState(null); 

            const [editingCourse, setEditingCourse] = useState(null);
            const [editingPromo, setEditingPromo] = useState(null);
            
            const [title, setTitle] = useState("");
            const [duration, setDuration] = useState("");
            const [price, setPrice] = useState("");
            const [targetAudience, setTargetAudience] = useState("");
            const [instructor, setInstructor] = useState("");
            const [desc, setDesc] = useState("");
            const [previewVideoUrl, setPreviewVideoUrl] = useState("");
            const [imageUrl, setImageUrl] = useState("");

            const [promoTitle, setPromoTitle] = useState("");
            const [promoType, setPromoType] = useState("image");
            const [promoUrl, setPromoUrl] = useState("");
            const [promoText, setPromoText] = useState("");

            const [socialTitle, setSocialTitle] = useState("");
            const [socialUrl, setSocialUrl] = useState("");
            const [socialIconUrl, setSocialIconUrl] = useState("");

            useEffect(() => {
                const unsubCourses = onSnapshot(query(collection(window.db, "courses"), orderBy("createdAt", "desc")), (snap) => setCourses(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubReq = onSnapshot(query(collection(window.db, "enrollmentRequests"), orderBy("createdAt", "desc")), (snap) => setRequests(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubStudents = onSnapshot(collection(window.db, "users"), (snap) => setStudents(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubPromos = onSnapshot(query(collection(window.db, "promos"), orderBy("createdAt", "desc")), (snap) => setPromos(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubSocial = onSnapshot(query(collection(window.db, "socialLinks"), orderBy("createdAt", "asc")), (snap) => setSocialLinks(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));

                return () => { unsubCourses(); unsubReq(); unsubStudents(); unsubPromos(); unsubSocial(); };
            }, []);

            const handleAddCourse = async (e) => {
                e.preventDefault();
                await addDoc(collection(window.db, "courses"), { title, duration, price, targetAudience, instructor, desc, previewVideoUrl, imageUrl, createdAt: new Date().toISOString() });
                setTitle(""); setDuration(""); setPrice(""); setTargetAudience(""); setInstructor(""); setDesc(""); setPreviewVideoUrl(""); setImageUrl("");
            };

            const handleUpdateCourse = async (e) => {
                e.preventDefault();
                try {
                    await updateDoc(doc(window.db, "courses", editingCourse.id), { 
                        title: editingCourse.title, duration: editingCourse.duration, price: editingCourse.price, 
                        targetAudience: editingCourse.targetAudience, instructor: editingCourse.instructor, 
                        desc: editingCourse.desc, previewVideoUrl: editingCourse.previewVideoUrl || "", 
                        imageUrl: editingCourse.imageUrl || ""
                    });
                    setEditingCourse(null);
                    alert("تم حفظ التعديلات بنجاح!");
                } catch(err) { alert("حدث خطأ. تأكد من حجم الصورة."); }
            };

            const handleDeleteCourse = async (id) => { if (confirm("هل أنت متأكد من حذف الدورة؟")) await deleteDoc(doc(window.db, "courses", id)); };

            const handleAddPromo = async (e) => {
                e.preventDefault();
                await addDoc(collection(window.db, "promos"), { title: promoTitle, type: promoType, url: promoType !== 'text' ? promoUrl : '', text: promoType === 'text' ? promoText : '', createdAt: new Date().toISOString() });
                setPromoTitle(""); setPromoUrl(""); setPromoText("");
            };

            const handleUpdatePromo = async (e) => {
                e.preventDefault();
                await updateDoc(doc(window.db, "promos", editingPromo.id), { ...editingPromo });
                setEditingPromo(null);
            };

            const handleDeletePromo = async (id) => await deleteDoc(doc(window.db, "promos", id));

            const handleAddSocialLink = async (e) => {
                e.preventDefault();
                if(!socialIconUrl) { alert("يرجى إرفاق الشعار"); return; }
                await addDoc(collection(window.db, "socialLinks"), { title: socialTitle, url: socialUrl, iconUrl: socialIconUrl, createdAt: new Date().toISOString() });
                setSocialTitle(""); setSocialUrl(""); setSocialIconUrl("");
            };

            const handleDeleteSocialLink = async (id) => await deleteDoc(doc(window.db, "socialLinks", id));

            const handleApproveRequest = async (reqId, studentId, courseId) => {
                await setDoc(doc(window.db, "users", studentId, "enrolledCourses", courseId), { enrolledAt: new Date().toISOString() });
                await updateDoc(doc(window.db, "enrollmentRequests", reqId), { status: "approved" });
            };

            const handleDeleteRequest = async (reqId) => {
                if (confirm("هل أنت متأكد من حذف هذا الطلب نهائياً؟")) { await deleteDoc(doc(window.db, "enrollmentRequests", reqId)); }
            };

            const handleOpenStudentProfile = async (studentId) => {
                const docSnap = await getDoc(doc(window.db, "users", studentId));
                if (docSnap.exists()) setViewingStudentModal(docSnap.data());
            };

            const pendingReqsCount = requests.filter(r => r.status === 'pending').length;

            return (

                        <div className="p-6 flex items-center gap-4 border-b border-gray-800">

                            <div>
                                <h1 className="text-xl font-black tracking-wide">لوحة الإدارة</h1>
                                <p className="text-xs text-gray-400 mt-1"><i className="fa-solid fa-crown text-yellow-500 ml-1"></i> منصة إبداع</p>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                            <button onClick={() => { setActiveSubTab("courses"); setSelectedCourseForLectures(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-bold ${activeSubTab === 'courses' ? 'bg-primary shadow-lg shadow-primary/30 text-white' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}>
                                <i className="fa-solid fa-book-open w-5 text-center"></i> إدارة الدورات
                            </button>
                            <button onClick={() => setActiveSubTab("promos")} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-bold ${activeSubTab === 'promos' ? 'bg-primary shadow-lg shadow-primary/30 text-white' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}>
                                <i className="fa-solid fa-bullhorn w-5 text-center"></i> العروض والإعلانات
                            </button>
                            <button onClick={() => setActiveSubTab("requests")} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl transition-all font-bold ${activeSubTab === 'requests' ? 'bg-primary shadow-lg shadow-primary/30 text-white' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}>
                                <div className="flex items-center gap-3"><i className="fa-solid fa-users w-5 text-center"></i> طلبات الانضمام</div>
                                {pendingReqsCount > 0 && <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">{pendingReqsCount}</span>}
                            </button>
                            <button onClick={() => setActiveSubTab("supportChats")} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-bold ${activeSubTab === 'supportChats' ? 'bg-primary shadow-lg shadow-primary/30 text-white' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}>
                                <i className="fa-solid fa-comments w-5 text-center"></i> محادثات الدعم
                            </button>
                            <button onClick={() => setActiveSubTab("social")} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-bold ${activeSubTab === 'social' ? 'bg-primary shadow-lg shadow-primary/30 text-white' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}`}>
                                <i className="fa-solid fa-hashtag w-5 text-center"></i> مواقع التواصل
                            </button>
                        </nav>
                        <div className="p-4 border-t border-gray-800">
                            <button onClick={() => signOut(window.auth)} className="w-full flex items-center justify-center gap-2 px-4 py-3 bg-red-500/10 text-red-500 rounded-xl font-bold hover:bg-red-500 hover:text-white transition-all">
                                <i className="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج
                            </button>
                        </div>
                    </aside>

                    {/* المحتوى الرئيسي */}
                    <main className="flex-1 p-6 lg:p-10 overflow-y-auto w-full">
                        {selectedCourseForLectures ? (
                            <AdminLecturesManager course={selectedCourseForLectures} onBack={() => setSelectedCourseForLectures(null)} />

                            <div className="grid grid-cols-1 xl:grid-cols-3 gap-8">
                                <div className="xl:col-span-1">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 sticky top-6">
                                        <h2 className="text-xl font-black text-gray-800 mb-6 flex items-center gap-2"><i className="fa-solid fa-plus-circle text-primary"></i> إضافة دورة جديدة</h2>
                                        <form onSubmit={handleAddCourse} className="space-y-4">

                                            <div className="grid grid-cols-2 gap-3">
                                                <div><label className="text-xs font-bold text-gray-500 mb-1 block">المدرب</label><input type="text" required value={instructor} onChange={e => setInstructor(e.target.value)} className="w-full px-4 py-2 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-primary text-sm" /></div>
                                                <div><label className="text-xs font-bold text-gray-500 mb-1 block">السعر</label><input type="text" required value={price} onChange={e => setPrice(e.target.value)} className="w-full px-4 py-2 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-primary text-sm" /></div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <div><label className="text-xs font-bold text-gray-500 mb-1 block">المدة</label><input type="text" required value={duration} onChange={e => setDuration(e.target.value)} className="w-full px-4 py-2 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-primary text-sm" /></div>
                                                <div><label className="text-xs font-bold text-gray-500 mb-1 block">الفئة المستهدفة</label><input type="text" required value={targetAudience} onChange={e => setTargetAudience(e.target.value)} className="w-full px-4 py-2 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-primary text-sm" /></div>

        function AdminSupportChatsManager({ students, preselectedStudent }) {
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [messages, setMessages] = useState([]);
            const [replyText, setReplyText] = useState("");
            const studentList = students.filter(s => s.role === 'student');

            useEffect(() => {
                if (preselectedStudent) {
                    const student = studentList.find(s => s.id === preselectedStudent.id) || preselectedStudent;
                    setSelectedStudent(student);
                }
            }, [preselectedStudent, students]);

            useEffect(() => {
                if (!selectedStudent) return;
                const q = query(collection(window.db, "users", selectedStudent.id, "supportChat"), orderBy("createdAt", "asc"));
                const unsub = onSnapshot(q, (snap) => setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => unsub();
            }, [selectedStudent]);

            const handleSendReply = async (e) => {
                e.preventDefault();
                if (!replyText.trim() || !selectedStudent) return;
                await addDoc(collection(window.db, "users", selectedStudent.id, "supportChat"), { sender: "admin", text: replyText, createdAt: new Date().toISOString() });
                setReplyText("");
            };

            return (
                <div className="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden flex flex-col md:flex-row h-[70vh]">
                    <div className="w-full md:w-80 bg-slate-50 border-l border-gray-100 flex flex-col">
                        <div className="p-5 border-b border-gray-200 bg-white"><h3 className="font-black text-gray-800"><i className="fa-solid fa-users text-primary mr-2"></i> قائمة الطلاب</h3></div>
                        <div className="flex-1 overflow-y-auto p-3 space-y-2">
                            {studentList.map(st => (
                                <button key={st.id} onClick={() => setSelectedStudent(st)} className={`w-full flex items-center gap-3 p-3 rounded-xl font-bold transition-all text-sm ${selectedStudent?.id === st.id ? 'bg-primary text-white shadow-md' : 'bg-white hover:bg-gray-100 text-gray-700 border border-gray-100'}`}>
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center ${selectedStudent?.id === st.id ? 'bg-white/20' : 'bg-gray-200 text-gray-500'}`}><i className="fa-solid fa-user"></i></div>
                                    <span className="truncate">{st.fullName || st.username}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                    <div className="flex-1 flex flex-col bg-white">
                        {selectedStudent ? (
                            <>
                                <div className="p-5 border-b border-gray-100 bg-white shadow-sm z-10 flex items-center gap-3">

        function AdminLecturesManager({ course, onBack }) {

            const [content, setContent] = useState("");

                return () => unsubscribe();
            }, [course.id]);

            const handleAddLecture = async (e) => {
                e.preventDefault();
                await addDoc(collection(window.db, "courses", course.id, "lectures"), { title, content, videoUrl, createdAt: new Date().toISOString() });
                setTitle(""); setContent(""); setVideoUrl("");

            const handleDeleteLecture = async (id) => await deleteDoc(doc(window.db, "courses", course.id, "lectures", id));

                <div className="animate-[fadeIn_0.3s_ease-out]">

                    <div className="bg-gradient-to-r from-primary to-secondary p-6 rounded-3xl shadow-lg mb-8 text-white flex items-center gap-5 relative overflow-hidden">

                        <div className="z-10">

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 h-fit">

                                <div><label className="text-xs font-bold text-gray-500 mb-1 block">رابط الفيديو (يوتيوب)</label><input type="url" value={videoUrl} onChange={e => setVideoUrl(e.target.value)} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-primary text-sm" dir="ltr" /></div>
                                <div><label className="text-xs font-bold text-gray-500 mb-1 block">محتوى إضافي / وصف</label><textarea required value={content} onChange={e => setContent(e.target.value)} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-primary text-sm h-28"></textarea></div>
                                <button type="submit" className="w-full bg-primary text-white py-3.5 rounded-xl font-black shadow-lg hover:bg-indigo-700 transition transform hover:-translate-y-0.5">حفظ ونشر الحلقة <i className="fa-solid fa-cloud-arrow-up ml-1"></i></button>

        // --- لوحة الطالب الاحترافية ---

                fetchProfile();

                const unsubCourses = onSnapshot(query(collection(window.db, "courses"), orderBy("createdAt", "desc")), (snap) => setCourses(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubPromos = onSnapshot(query(collection(window.db, "promos"), orderBy("createdAt", "desc")), (snap) => setPromos(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubSocial = onSnapshot(query(collection(window.db, "socialLinks"), orderBy("createdAt", "asc")), (snap) => setSocialLinks(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubEnrolled = onSnapshot(collection(window.db, "users", user.uid, "enrolledCourses"), (snap) => setEnrolledCourseIds(snap.docs.map(d => d.id)));
                
                const unsubReqs = onSnapshot(collection(window.db, "enrollmentRequests"), (snap) => {
                    const reqMap = {}; 
                    snap.docs.forEach(d => { const data = d.data(); if (data.studentId === user.uid) reqMap[data.courseId] = { status: data.status, reqId: d.id }; }); 
                    setMyRequests(reqMap);
                });

                const qMsg = query(collection(window.db, "users", user.uid, "supportChat"), orderBy("createdAt", "desc"), limit(1));
                const unsubMsgs = onSnapshot(qMsg, (snap) => {
                    if (!snap.empty) { const lastMsg = snap.docs[0].data(); if (lastMsg.sender === "admin" && !showSupportChat) setHasNewAdminMessage(true); }
                });

                return () => { unsubCourses(); unsubPromos(); unsubSocial(); unsubEnrolled(); unsubReqs(); unsubMsgs(); };

            if (profile && !profile.profileComplete) return <CompleteProfile user={user} onComplete={(data) => setProfile({ ...profile, ...data, profileComplete: true })} />;

                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => {setActiveTab("explore"); setSelectedCourse(null);}}>

                        </div>

                            <button onClick={() => { setActiveTab("explore"); setSelectedCourse(null); }} className={`px-4 sm:px-6 py-2 rounded-full font-bold text-xs sm:text-sm transition-all duration-300 ${activeTab === 'explore' && !selectedCourse ? 'bg-white text-primary shadow-sm' : 'text-gray-500 hover:text-gray-800'}`}>الاستكشاف</button>
                            <button onClick={() => { setActiveTab("myCourses"); setSelectedCourse(null); }} className={`px-4 sm:px-6 py-2 rounded-full font-bold text-xs sm:text-sm transition-all duration-300 flex items-center gap-2 ${activeTab === 'myCourses' && !selectedCourse ? 'bg-white text-primary shadow-sm' : 'text-gray-500 hover:text-gray-800'}`}>دوراتي {enrolledCoursesList.length > 0 && <span className="bg-primary text-white text-[10px] px-1.5 py-0.5 rounded-full">{enrolledCoursesList.length}</span>}</button>
                            <button onClick={() => { setActiveTab("profile"); setSelectedCourse(null); }} className={`px-4 sm:px-6 py-2 rounded-full font-bold text-xs sm:text-sm transition-all duration-300 ${activeTab === 'profile' ? 'bg-white text-primary shadow-sm' : 'text-gray-500 hover:text-gray-800'}`}>الملف</button>
                        </div>
                        <button onClick={() => signOut(window.auth)} className="w-10 h-10 bg-red-50 text-red-500 rounded-full flex items-center justify-center hover:bg-red-500 hover:text-white transition"><i className="fa-solid fa-power-off"></i></button>
                    </nav>

                                                </div>
                                                <div className="relative z-10 grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    {promos.map(p => (

                                            </div>

                                                                <div className="mt-auto pt-4 border-t border-gray-100 flex items-center justify-between">

                                                                </div>
                                                            </div>
                                                        </div>

                                        </div>

                                {activeTab === "myCourses" && (

                                        <div className="flex items-center gap-3 mb-8">

                                                    </div>

            const [messages, setMessages] = useState([]);

                const q = query(collection(window.db, "users", user.uid, "supportChat"), orderBy("createdAt", "asc"));
                const unsub = onSnapshot(q, (snap) => {
                    setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));

                });
                return () => unsub();

            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState("");

            useEffect(() => {
                const q = query(collection(window.db, "courses", course.id, "lectures"), orderBy("createdAt", "asc"));
                const unsub = onSnapshot(q, (snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setLectures(list);
                    if (list.length > 0 && !activeLecture) setActiveLecture(list[0]);
                });
                return () => unsub();
            }, [course.id]);

            useEffect(() => {
                if (!activeLecture) return;
                const qComm = query(collection(window.db, "courses", course.id, "lectures", activeLecture.id, "comments"), orderBy("createdAt", "asc"));
                const unsubComm = onSnapshot(qComm, (snap) => setComments(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => unsubComm();
            }, [course.id, activeLecture]);

            const handleAddComment = async (e) => {
                e.preventDefault();
                if (!newComment.trim()) return;
                await addDoc(collection(window.db, "courses", course.id, "lectures", activeLecture.id, "comments"), { userId: user.uid, userName: profile?.fullName || user.email.split('@')[0], text: newComment, isAdminReply: false, createdAt: new Date().toISOString() });
                setNewComment("");
            };

            return (
                <div className="animate-[fadeIn_0.5s_ease-out]">
                    <button onClick={onBack} className="mb-6 flex items-center gap-2 bg-white border border-gray-200 text-gray-700 px-5 py-2.5 rounded-full font-black text-sm hover:bg-gray-50 transition shadow-sm"><i className="fa-solid fa-arrow-right"></i> العودة للخلف</button>
                    
                    <div className="bg-white rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden mb-8">
                        <div className="h-32 sm:h-48 bg-dark relative flex items-center px-8">
                            <div className="absolute inset-0 bg-gradient-to-r from-primary/80 to-secondary/80"></div>
                            <div className="absolute -top-24 -right-24 w-96 h-96 bg-white opacity-10 rounded-full blur-3xl"></div>
                            <div className="relative z-10">
                                <span className="bg-white/20 backdrop-blur text-white text-xs font-bold px-3 py-1 rounded-full inline-block mb-3 border border-white/20"><i className="fa-solid fa-book-open mr-1"></i> قاعة المحاضرات</span>
                                <h2 className="text-3xl sm:text-4xl font-black text-white drop-shadow-md">{course.title}</h2>
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-8">
                        <div className="w-full lg:w-1/3 space-y-4">
                            <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 h-fit">
                                <h3 className="font-black text-gray-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-list-ul text-primary"></i> الفهرس ({lectures.length})</h3>
                                <div className="space-y-2">
                                    {lectures.map((lec, idx) => (
                                        <button key={lec.id} onClick={() => setActiveLecture(lec)} className={`w-full text-right p-4 rounded-2xl font-bold text-sm flex items-center gap-3 transition-all ${activeLecture?.id === lec.id ? 'bg-primary text-white shadow-md transform scale-[1.02]' : 'bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-100'}`}>
                                            <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${activeLecture?.id === lec.id ? 'bg-white/20' : 'bg-white text-gray-400 shadow-sm'}`}><i className={lec.videoUrl ? "fa-solid fa-play text-xs" : "fa-solid fa-file-lines text-xs"}></i></div>
                                            <span className="line-clamp-1">{idx + 1}. {lec.title}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="w-full lg:w-2/3">
                            {activeLecture ? (
                                <div className="space-y-6 animate-[fadeInUp_0.4s_ease-out]">
                                    <div className="bg-white p-6 sm:p-8 rounded-[2rem] shadow-sm border border-gray-100">
                                        <h3 className="text-2xl font-black text-gray-800 mb-6">{activeLecture.title}</h3>
                                        
                                        {activeLecture.videoUrl && (
                                            <div className="w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-inner mb-6">
                                                <iframe src={getEmbedUrl(activeLecture.videoUrl)} className="w-full h-full border-0" allowFullScreen></iframe>
                                            </div>
                                        )}
                                        
                                        <div className="bg-gray-50 p-6 rounded-2xl border border-gray-100 text-gray-700 leading-loose text-sm sm:text-base font-medium">
                                            {activeLecture.content.split('\n').map((paragraph, i) => <p key={i} className="mb-2">{paragraph}</p>)}
                                        </div>
                                    </div>

                                    <div className="bg-white p-6 sm:p-8 rounded-[2rem] shadow-sm border border-gray-100">
                                        <h4 className="font-black text-xl text-gray-800 mb-6 flex items-center gap-2"><i className="fa-regular fa-comments text-primary"></i> مساحة النقاش التعاوني</h4>
                                        
                                        <div className="space-y-4 mb-8 max-h-[400px] overflow-y-auto pr-2">
                                            {comments.length === 0 && <div className="text-center py-8 text-gray-400"><i className="fa-regular fa-comment-dots text-4xl mb-2 opacity-50"></i><p className="font-bold text-sm">كن أول من يشارك في النقاش!</p></div>}
                                            {comments.map(c => (
                                                <div key={c.id} className={`flex ${c.isAdminReply ? 'justify-end' : 'justify-start'}`}>
                                                    <div className={`p-4 rounded-2xl max-w-[85%] text-sm ${c.isAdminReply ? 'bg-indigo-50 border border-indigo-100 text-gray-800 rounded-tr-sm' : 'bg-gray-50 border border-gray-100 text-gray-700 rounded-tl-sm'}`}>
                                                        <div className="flex items-center gap-2 mb-2">
                                                            <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] ${c.isAdminReply ? 'bg-primary text-white' : 'bg-gray-300 text-gray-600'}`}><i className={c.isAdminReply ? "fa-solid fa-crown" : "fa-solid fa-user"}></i></div>
                                                            <span className="font-black text-xs text-gray-900">{c.userName}</span>
                                                        </div>
                                                        <p className="leading-relaxed">{c.text}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <form onSubmit={handleAddComment} className="flex gap-3 relative">
                                            <div className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"><i className="fa-solid fa-pen"></i></div>
                                            <input type="text" value={newComment} onChange={e => setNewComment(e.target.value)} className="flex-1 pr-12 pl-4 py-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm font-bold transition-all shadow-inner" placeholder="اكتب سؤالك أو ملاحظاتك هنا..." />
                                            <button type="submit" disabled={!newComment.trim()} className="bg-primary text-white px-8 py-4 rounded-2xl font-black shadow-[0_4px_15px_rgba(79,70,229,0.3)] hover:bg-indigo-700 transition transform hover:-translate-y-0.5 disabled:opacity-50 disabled:transform-none">إرسال</button>
                                        </form>
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full bg-white rounded-[2rem] border border-gray-100 flex flex-col items-center justify-center py-24 text-gray-400 shadow-sm">
                                    <div className="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center text-4xl mb-4 shadow-inner"><i className="fa-solid fa-tv"></i></div>
                                    <p className="font-black text-xl text-gray-600 mb-2">اختر حلقة من الفهرس</p>
                                    <p className="text-sm font-bold">لبدء المشاهدة والاستفادة من المحتوى</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
