        return (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                    <h3 className="text-xl font-black text-gray-800 mb-6"><i className="fa-solid fa-bullhorn text-secondary ml-2"></i>إضافة إعلان</h3>
                    <form onSubmit={add} className="space-y-4">
                        {PromoFields({ v: form, set: setForm })}
                        <button type="submit" className="w-full bg-secondary text-white py-3 rounded-xl font-bold shadow-lg hover:bg-purple-700 transition">نشر الإعلان</button>
                    </form>
                </div>
                <div className="lg:col-span-2 space-y-4">
                    <h3 className="text-2xl font-black text-gray-800 mb-6 border-b pb-2">الإعلانات المنشورة ({promos.length})</h3>
                    {promos.map((p) => (
                        <div key={p.id} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex gap-4 items-center">
                            <div className="w-20 h-20 shrink-0 bg-gray-100 rounded-xl overflow-hidden flex items-center justify-center">
                                {p.type === "image" && p.url ? <img src={p.url} className="w-full h-full object-cover" /> : <i className={`fa-solid ${p.type === "video" ? "fa-play text-red-500" : "fa-align-right text-gray-400"} text-2xl`}></i>}
                            </div>
                            <div className="flex-1 min-w-0">
                                <h4 className="font-black text-gray-800">{p.title}</h4>
                                <p className="text-gray-500 text-xs line-clamp-2 mt-1">{p.type === "text" ? p.text : p.type === "video" ? p.url : "صورة"}</p>
                            </div>
                            <div className="flex flex-col gap-2">
                                <button onClick={() => setEditing({ ...p })} className="w-9 h-9 bg-gray-100 rounded-xl hover:bg-gray-200"><i className="fa-solid fa-pen text-xs"></i></button>
                                <button onClick={() => confirm("حذف الإعلان؟") && deleteDoc(doc(db, "promos", p.id))} className="w-9 h-9 bg-red-50 text-red-600 rounded-xl hover:bg-red-100"><i className="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </div>
                    ))}
                </div>
                {editing && (
                    <Modal onClose={() => setEditing(null)}>
                        <form onSubmit={save} className="p-6 sm:p-8 space-y-4">
                            <h3 className="text-xl font-black text-gray-800 mb-2">تعديل الإعلان</h3>
                            {PromoFields({ v: editing, set: setEditing })}
                            <button type="submit" className="w-full bg-secondary text-white py-3 rounded-xl font-bold">حفظ</button>
                        </form>
                    </Modal>
                )}
            </div>
        );
    }

    function AdminSocial({ socialLinks }) {
        const [f, setF] = useState({ title: "", url: "", iconUrl: "" });
        const add = async (e) => {
            e.preventDefault();
            if (!f.iconUrl) { toast("يرجى إرفاق الشعار", "error"); return; }
            await addDoc(collection(db, "socialLinks"), { ...f, createdAt: nowISO() });
            setF({ title: "", url: "", iconUrl: "" }); toast("تم حفظ الرابط");
        };
        return (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                    <h3 className="text-xl font-black text-gray-800 mb-6"><i className="fa-solid fa-hashtag text-blue-500 ml-2"></i>إضافة رابط تواصل</h3>
                    <form onSubmit={add} className="space-y-4">
                        <input placeholder="اسم المنصة (مثال: تيك توك)" required value={f.title} onChange={(e) => setF({ ...f, title: e.target.value })} className={inputCls} />
                        <input type="url" placeholder="الرابط" required value={f.url} onChange={(e) => setF({ ...f, url: e.target.value })} className={inputCls} dir="ltr" />
                        <Field label="الشعار"><ImagePicker round value={f.iconUrl} onChange={(v) => setF({ ...f, iconUrl: v })} /></Field>
                        <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow hover:bg-blue-700 transition">حفظ الرابط</button>
                    </form>
                </div>
                <div className="lg:col-span-2">
                    <h3 className="text-2xl font-black text-gray-800 mb-6 border-b pb-2">الروابط المتوفرة للطلاب</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {socialLinks.map((l) => (
                            <div key={l.id} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <img src={l.iconUrl} className="w-12 h-12 object-cover rounded-full shadow" />
                                    <div><p className="font-black text-gray-800">{l.title}</p><a href={l.url} target="_blank" className="text-xs font-bold text-blue-500">زيارة الرابط</a></div>
                                </div>
                                <button onClick={() => confirm("حذف الرابط؟") && deleteDoc(doc(db, "socialLinks", l.id))} className="text-gray-300 hover:text-red-500 w-10 h-10 rounded-full"><i className="fa-solid fa-trash"></i></button>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );
    }

    function AdminSettings() {
        const s = useSettings();
        const [f, setF] = useState(null);
        useEffect(() => { if (!f) setF(s); }, [s]);
        if (!f) return null;
        const save = async (e) => {
            e.preventDefault();
            await setDoc(doc(db, "settings", "site"), { bankName: f.bankName, iban: f.iban.replace(/\s/g, ""), whatsapp: f.whatsapp.replace(/\D/g, ""), announcement: f.announcement }, { merge: true });
            toast("تم حفظ الإعدادات");
        };
        return (
            <div className="max-w-2xl">
                <form onSubmit={save} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <h3 className="text-xl font-black text-gray-800 mb-2"><i className="fa-solid fa-building-columns text-primary ml-2"></i>بيانات التحويل البنكي</h3>
                    <Field label="اسم صاحب الحساب"><input value={f.bankName} onChange={(e) => setF({ ...f, bankName: e.target.value })} className={inputCls} /></Field>
                    <Field label="رقم الآيبان"><input value={f.iban} onChange={(e) => setF({ ...f, iban: e.target.value })} className={inputCls} dir="ltr" /></Field>
                    <Field label="رقم واتساب استلام الإيصالات (بالصيغة الدولية)"><input value={f.whatsapp} onChange={(e) => setF({ ...f, whatsapp: e.target.value })} className={inputCls} dir="ltr" placeholder="9665xxxxxxxx" /></Field>
                    <Field label="شريط إعلان أعلى صفحة الطلاب (اختياري)"><input value={f.announcement} onChange={(e) => setF({ ...f, announcement: e.target.value })} className={inputCls} placeholder="مثال: خصم 20% على دورات موهبة حتى نهاية الشهر" /></Field>
                    <button type="submit" className="w-full bg-primary text-white py-3 rounded-xl font-bold">حفظ الإعدادات</button>
                </form>
            </div>
        );
    }

    // ================== لوحة الطالب ==================
    function StudentDashboard({ user }) {
        const settings = useSettings();
        const [tab, setTab] = useState("explore");
        const [profile, setProfile] = useState(undefined);
        const [courses, setCourses] = useState([]);
        const [promos, setPromos] = useState([]);
        const [socialLinks, setSocialLinks] = useState([]);
        const [enrolledIds, setEnrolledIds] = useState([]);
        const [myRequests, setMyRequests] = useState({});
        const [progress, setProgress] = useState({});
        const [chatMeta, setChatMeta] = useState(null);
        const [openCourse, setOpenCourse] = useState(null);
        const [preview, setPreview] = useState(null);
        const [checkout, setCheckout] = useState(null);
        const [promoModal, setPromoModal] = useState(null);
        const [showChat, setShowChat] = useState(false);
        const [search, setSearch] = useState("");
        const [category, setCategory] = useState("الكل");

        useEffect(() => {
            const map = (set) => (snap) => set(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
            const err = () => {};
            const unsubs = [
                onSnapshot(doc(db, "users", user.uid), (d) => setProfile(d.exists() ? d.data() : null), err),
                onSnapshot(query(collection(db, "courses"), orderBy("createdAt", "desc")), map(setCourses), err),
                onSnapshot(query(collection(db, "promos"), orderBy("createdAt", "desc")), map(setPromos), err),
                onSnapshot(query(collection(db, "socialLinks"), orderBy("createdAt", "asc")), map(setSocialLinks), err),
                onSnapshot(collection(db, "users", user.uid, "enrolledCourses"), (s) => setEnrolledIds(s.docs.map((d) => d.id)), err),
                onSnapshot(collection(db, "users", user.uid, "progress"), (s) => { const p = {}; s.docs.forEach((d) => (p[d.id] = d.data())); setProgress(p); }, err),
                onSnapshot(query(collection(db, "enrollmentRequests"), where("studentId", "==", user.uid)), (s) => {
                    const m = {};
                    s.docs.map((d) => ({ reqId: d.id, ...d.data() })).sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt))).forEach((r) => (m[r.courseId] = r));
                    setMyRequests(m);
                }, err),
                onSnapshot(doc(db, "chatMeta", user.uid), (d) => setChatMeta(d.exists() ? d.data() : null), err),
            ];
            return () => unsubs.forEach((u) => u());
        }, [user.uid]);

        if (profile === undefined) return <div className="min-h-screen flex items-center justify-center"><i className="fa-solid fa-circle-notch fa-spin text-primary text-4xl"></i></div>;
        if (!profile || !profile.profileComplete) return <CompleteProfile user={user} profile={profile} />;

        const visible = courses.filter((c) => c.published !== false || enrolledIds.includes(c.id));
        const categories = ["الكل", ...new Set(visible.map((c) => c.category).filter(Boolean))];
        const filtered = visible.filter((c) => (category === "الكل" || c.category === category) && `${c.title} ${c.instructor} ${c.desc || ""}`.includes(search.trim()));
        const myCourses = courses.filter((c) => enrolledIds.includes(c.id));
        const firstName = profile.fullName?.split(" ")[0] || "";
        const hasUnread = chatMeta?.unreadStudent && !showChat;

        const cancelRequest = async (r) => { if (confirm("إلغاء طلب الانضمام؟")) { await deleteDoc(doc(db, "enrollmentRequests", r.reqId)); toast("تم إلغاء الطلب", "info"); } };
        const goTab = (t) => { setTab(t); setOpenCourse(null); window.scrollTo({ top: 0 }); };

        return (
            <div className="min-h-screen bg-slate-50 pb-24">
                {settings.announcement && <div className="bg-gradient-to-l from-primary to-secondary text-white text-center text-sm font-bold py-2 px-4"><i className="fa-solid fa-bullhorn ml-2"></i>{settings.announcement}</div>}
                <nav className="glass-panel sticky top-0 z-40 border-b border-gray-200/50 shadow-sm px-3 sm:px-8 py-3 flex justify-between items-center gap-2">
                    <button className="flex items-center gap-3 shrink-0" onClick={() => goTab("explore")}>
                        <img src={SITE.logo} className="w-10 h-10 object-cover rounded-full border-2 border-primary" />
                        <h1 className="text-xl font-black text-gray-800 hidden sm:block">إبداع <span className="text-primary">Edu</span></h1>
                    </button>
                    <div className="flex items-center bg-gray-100/80 p-1 rounded-full border border-gray-200">
                        {[["explore", "الاستكشاف"], ["myCourses", "دوراتي"], ["profile", "حسابي"]].map(([k, l]) => (
                            <button key={k} onClick={() => goTab(k)} className={`px-3 sm:px-6 py-2 rounded-full font-bold text-xs sm:text-sm transition-all flex items-center gap-1.5 ${tab === k && !openCourse ? "bg-white text-primary shadow-sm" : "text-gray-500 hover:text-gray-800"}`}>
                                {l}{k === "myCourses" && myCourses.length > 0 && <span className="bg-primary text-white text-[10px] px-1.5 py-0.5 rounded-full">{myCourses.length}</span>}
                            </button>
                        ))}
                    </div>
                    <button onClick={() => signOut(auth)} className="w-10 h-10 shrink-0 bg-red-50 text-red-500 rounded-full hover:bg-red-500 hover:text-white transition"><i className="fa-solid fa-power-off"></i></button>
                </nav>

                <div className="max-w-7xl mx-auto p-4 sm:p-8">
                    {openCourse ? (
                        <StudentCourseView course={openCourse} user={user} profile={profile} progress={progress[openCourse.id]} onBack={() => setOpenCourse(null)} />
                    ) : tab === "explore" ? (
                        <div className="space-y-10 animate-[fadeIn_.4s_ease-out]">
                            <div className="relative bg-dark rounded-[2rem] p-6 sm:p-10 overflow-hidden shadow-2xl">
                                <div className="absolute inset-0 bg-gradient-to-l from-primary/80 to-secondary/80"></div>
                                <div className="absolute -top-24 -right-24 w-96 h-96 bg-white opacity-10 rounded-full blur-3xl pointer-events-none"></div>
                                <div className="relative z-10 text-white">
                                    <h2 className="text-2xl sm:text-4xl font-black mb-2">أهلاً بك يا <span className="text-yellow-300">{firstName}</span>! ✨</h2>
                                    <p className="text-indigo-100 sm:text-lg mb-6">جاهز تكمل رحلة التميز اليوم؟</p>
                                    {myCourses.length > 0 && (
                                        <div className="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                                            {myCourses.slice(0, 3).map((c) => <ContinueChip key={c.id} course={c} prog={progress[c.id]} onOpen={() => setOpenCourse(c)} />)}
                                        </div>
                                    )}
                                </div>
                                {promos.length > 0 && (
                                    <div className="relative z-10 grid grid-cols-1 md:grid-cols-2 gap-5 mt-8">
                                        {promos.map((p) => (
                                            <div key={p.id} onClick={() => setPromoModal(p)} className="bg-white/10 backdrop-blur-md border border-white/20 p-4 rounded-3xl cursor-pointer hover:bg-white/20 transition group">
                                                <h3 className="font-black text-lg text-white line-clamp-1 mb-3"><i className={`fa-solid ${p.type === "image" ? "fa-image" : p.type === "video" ? "fa-play" : "fa-bullhorn"} ml-2`}></i>{p.title}</h3>
                                                {p.type === "image" ? <img src={p.url} className="w-full h-44 object-cover rounded-2xl" />
                                                    : p.type === "video" ? <div className="w-full h-44 bg-black rounded-2xl overflow-hidden pointer-events-none"><iframe src={getEmbedUrl(p.url)} className="w-full h-full"></iframe></div>
                                                    : <p className="text-indigo-50 text-sm bg-black/20 p-4 rounded-2xl line-clamp-3 leading-relaxed">{p.text}</p>}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div>
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
                                    <div className="flex items-center gap-3"><div className="w-2 h-8 bg-primary rounded-full"></div><h2 className="text-2xl sm:text-3xl font-black text-gray-800">البرامج والدورات</h2></div>
                                    <div className="relative sm:w-72">
                                        <i className="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                        <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="ابحث عن دورة..." className={inputCls + " pr-11 bg-white rounded-full"} />
                                    </div>
                                </div>
                                {categories.length > 2 && (
                                    <div className="flex gap-2 overflow-x-auto no-scrollbar mb-6">
                                        {categories.map((c) => <button key={c} onClick={() => setCategory(c)} className={`shrink-0 px-4 py-2 rounded-full text-sm font-bold transition ${category === c ? "bg-primary text-white shadow" : "bg-white text-gray-600 border border-gray-200"}`}>{c}</button>)}
                                    </div>
                                )}
                                {filtered.length === 0 ? <EmptyState icon="fa-magnifying-glass" title="لا توجد دورات مطابقة" /> : (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                        {filtered.map((c) => <CourseCard key={c.id} course={c} enrolled={enrolledIds.includes(c.id)} request={myRequests[c.id]} onClick={() => setPreview(c)} />)}
                                    </div>
                                )}
                            </div>
                        </div>
                    ) : tab === "myCourses" ? (
                        <div className="animate-[fadeIn_.4s_ease-out]">
                            <div className="flex items-center gap-3 mb-8"><div className="w-2 h-8 bg-green-500 rounded-full"></div><h2 className="text-2xl sm:text-3xl font-black text-gray-800">دوراتي التعليمية</h2></div>
                            {myCourses.length === 0 ? (
                                <EmptyState icon="fa-folder-open" title="ليس لديك دورات مشترك بها حالياً" sub="استكشف البرامج المتاحة وابدأ رحلة التعلم الآن.">
                                    <button onClick={() => goTab("explore")} className="bg-primary text-white px-8 py-3 rounded-xl font-bold shadow-lg">تصفح الدورات</button>
                                </EmptyState>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {myCourses.map((c) => <MyCourseCard key={c.id} course={c} prog={progress[c.id]} onOpen={() => setOpenCourse(c)} />)}
                                </div>
                            )}
                        </div>
                    ) : (
                        <StudentProfileView user={user} profile={profile} myCourses={myCourses} progress={progress} />
                    )}

                    {socialLinks.length > 0 && !openCourse && (
                        <div className="mt-20 pt-10 border-t border-gray-200 text-center pb-8">
                            <h3 className="text-gray-400 text-xs font-black mb-5">تابع {SITE.name} عبر</h3>
                            <div className="flex justify-center gap-5 flex-wrap">
                                {socialLinks.map((l) => <a key={l.id} href={l.url} target="_blank" title={l.title}><img src={l.iconUrl} className="w-12 h-12 object-cover rounded-full border border-gray-200 shadow-sm hover:scale-110 transition" /></a>)}
                            </div>
                        </div>
                    )}
                </div>

                {preview && !checkout && (
                    <CoursePreviewModal
                        course={preview} enrolled={enrolledIds.includes(preview.id)} request={myRequests[preview.id]} settings={settings}
                        onClose={() => setPreview(null)}
                        onEnter={() => { setOpenCourse(preview); setPreview(null); window.scrollTo({ top: 0 }); }}
                        onSubscribe={() => setCheckout(preview)}
                        onCancel={(r) => { cancelRequest(r); setPreview(null); }}
                    />
                )}
                {checkout && <CheckoutModal course={checkout} user={user} profile={profile} settings={settings} existingRequest={myRequests[checkout.id]} onClose={() => { setCheckout(null); setPreview(null); }} />}

                {promoModal && (
                    <Modal onClose={() => setPromoModal(null)}>
                        {promoModal.type === "image" ? <img src={promoModal.url} className="w-full max-h-[70vh] object-contain bg-black" />
                            : promoModal.type === "video" ? <div className="w-full aspect-video bg-black"><iframe src={getEmbedUrl(promoModal.url)} className="w-full h-full" allowFullScreen></iframe></div>
                            : <div className="bg-gradient-to-br from-primary to-secondary h-28 flex items-center justify-center text-white text-4xl"><i className="fa-solid fa-bullhorn"></i></div>}
                        <div className="p-6">
                            <h3 className="text-2xl font-black text-gray-800 mb-3">{promoModal.title}</h3>
                            {promoModal.type === "text" && <p className="text-gray-600 text-sm leading-relaxed bg-gray-50 p-5 rounded-2xl whitespace-pre-wrap">{promoModal.text}</p>}
                        </div>
                    </Modal>
                )}

                <div className="fixed bottom-5 left-5 sm:bottom-8 sm:left-8 z-50 flex flex-col items-start">
                    {showChat && (
                        <div className="bg-white rounded-3xl shadow-2xl border border-gray-100 w-[calc(100vw-2.5rem)] sm:w-[360px] flex flex-col h-[70vh] sm:h-[520px] mb-4 animate-[fadeInUp_.3s_ease-out] overflow-hidden">
                            <div className="bg-gradient-to-r from-primary to-secondary text-white p-4 flex justify-between items-center">
                                <div className="flex items-center gap-2"><div className="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center"><i className="fa-solid fa-headset"></i></div><span className="font-black text-sm">الدعم الفني المباشر</span></div>
                                <button onClick={() => setShowChat(false)} className="w-8 h-8 rounded-full hover:bg-white/20"><i className="fa-solid fa-chevron-down"></i></button>
                            </div>
                            <StudentChat user={user} profile={profile} />
                        </div>
                    )}
                    {!showChat && (
                        <button onClick={() => setShowChat(true)} className="relative bg-primary hover:bg-indigo-700 text-white w-16 h-16 rounded-full shadow-[0_10px_25px_rgba(79,70,229,0.5)] flex items-center justify-center transition hover:scale-110">
                            {hasUnread && <span className="absolute top-0 right-0 flex h-4 w-4"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span className="relative inline-flex rounded-full h-4 w-4 bg-red-500 border-2 border-white"></span></span>}
                            <i className="fa-solid fa-comments text-2xl"></i>
                        </button>
                    )}
                </div>
            </div>
        );
    }

    function useLectureCount(courseId) {
        const [n, setN] = useState(null);
        useEffect(() => { getDocs(collection(db, "courses", courseId, "lectures")).then((s) => setN(s.size)).catch(() => setN(0)); }, [courseId]);
        return n;
    }
    const pct = (prog, total) => (total ? Math.round(((prog?.completed?.length || 0) / total) * 100) : 0);

    function ContinueChip({ course, prog, onOpen }) {
        const total = useLectureCount(course.id);
        const p = pct(prog, total);
        return (
            <button onClick={onOpen} className="shrink-0 w-60 bg-white/15 backdrop-blur border border-white/20 rounded-2xl p-3 text-right hover:bg-white/25 transition">
                <p className="font-black text-sm line-clamp-1 mb-2"><i className="fa-solid fa-play-circle ml-1"></i>{course.title}</p>
                <div className="w-full h-1.5 bg-white/20 rounded-full overflow-hidden"><div className="h-full bg-yellow-300 rounded-full" style={{ width: `${p}%` }}></div></div>
                <p className="text-[11px] mt-1 text-indigo-100">{p}% مكتمل</p>
            </button>
        );
    }

    function CourseCard({ course, enrolled, request, onClick }) {
        return (
            <div onClick={onClick} className="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 overflow-hidden flex flex-col cursor-pointer group hover:shadow-xl transition-all duration-300 hover:-translate-y-1">
                <div className="h-48 relative overflow-hidden bg-gray-100">
                    {course.imageUrl ? <img src={course.imageUrl} loading="lazy" className="w-full h-full object-cover group-hover:scale-110 transition duration-700" /> : <div className="w-full h-full flex items-center justify-center text-gray-300"><i className="fa-solid fa-graduation-cap text-5xl"></i></div>}
                    <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-60"></div>
                    <div className="absolute bottom-4 right-4 bg-white/95 text-primary text-xs font-black px-3 py-1.5 rounded-full shadow-lg">{formatPrice(course)}</div>
                    {course.category && <div className="absolute top-4 right-4 bg-black/40 backdrop-blur text-white text-[11px] font-bold px-3 py-1 rounded-full">{course.category}</div>}
                    {enrolled ? <div className="absolute top-4 left-4 bg-green-500 text-white text-xs font-black px-3 py-1 rounded-full shadow-lg"><i className="fa-solid fa-check ml-1"></i>مشترك</div>
                        : request?.status === "pending" ? <div className="absolute top-4 left-4 bg-yellow-400 text-yellow-900 text-xs font-black px-3 py-1 rounded-full shadow-lg"><i className="fa-solid fa-hourglass-half ml-1"></i>قيد المراجعة</div> : null}
                </div>
                <div className="p-5 flex flex-col flex-1">

    function StudentChat({ user, profile }) {
        const [messages, setMessages] = useState([]);

            }, () => {});
        }, [user.uid]);
        const send = async (e) => {
            e.preventDefault();

            setText("");

        };

                    <div ref={endRef}></div>
                </div>
                <form onSubmit={send} className="p-3 bg-white border-t border-gray-100 flex gap-2">

        );

    function StudentCourseView({ course, user, profile, progress, onBack }) {
        const [lectures, setLectures] = useState([]);
        const [activeId, setActiveId] = useState(progress?.lastLectureId || null);
        const [loading, setLoading] = useState(true);
        const [denied, setDenied] = useState(false);
        const completed = progress?.completed || [];

        useEffect(() => onSnapshot(query(collection(db, "courses", course.id, "lectures"), orderBy("createdAt", "asc")), (s) => {
            const list = sortLectures(s.docs.map((d) => ({ id: d.id, ...d.data() })));
            setLectures(list);
            setActiveId((cur) => (cur && list.some((l) => l.id === cur)) ? cur : (list.find((l) => !completed.includes(l.id)) || list[0])?.id || null);
            setLoading(false);
        }, () => { setDenied(true); setLoading(false); }), [course.id]);

        const idx = lectures.findIndex((l) => l.id === activeId);
        const active = lectures[idx];
        const p = lectures.length ? Math.round((completed.filter((id) => lectures.some((l) => l.id === id)).length / lectures.length) * 100) : 0;
        const progRef = doc(db, "users", user.uid, "progress", course.id);

        const select = (id) => {
            setActiveId(id);
            setDoc(progRef, { lastLectureId: id, updatedAt: nowISO() }, { merge: true }).catch(() => {});
            window.scrollTo({ top: 0, behavior: "smooth" });
        };
        const toggleDone = async () => {
            const done = completed.includes(activeId);
            await setDoc(progRef, { completed: done ? arrayRemove(activeId) : arrayUnion(activeId), lastLectureId: activeId, updatedAt: nowISO() }, { merge: true });
            if (!done) {
                if (completed.length + 1 >= lectures.length) toast("مبروك! أنهيت الدورة بالكامل 🏆");
                else if (idx < lectures.length - 1) select(lectures[idx + 1].id);
            }
        };

        return (
            <div className="animate-[fadeIn_.4s_ease-out]">
                <button onClick={onBack} className="mb-5 flex items-center gap-2 bg-white border border-gray-200 text-gray-700 px-5 py-2.5 rounded-full font-black text-sm hover:bg-gray-50 shadow-sm"><i className="fa-solid fa-arrow-right"></i> العودة</button>
                <div className="bg-dark rounded-[2rem] overflow-hidden mb-6 relative p-6 sm:p-8">
                    <div className="absolute inset-0 bg-gradient-to-r from-primary/80 to-secondary/80"></div>
                    <div className="relative z-10 text-white">
                        <span className="bg-white/20 text-xs font-bold px-3 py-1 rounded-full inline-block mb-3"><i className="fa-solid fa-book-open ml-1"></i>قاعة المحاضرات</span>
                        <h2 className="text-2xl sm:text-4xl font-black mb-4">{course.title}</h2>
                        <div className="flex items-center gap-3 max-w-md">
                            <div className="flex-1 h-2.5 bg-white/20 rounded-full overflow-hidden"><div className="h-full bg-yellow-300 rounded-full transition-all duration-700" style={{ width: `${p}%` }}></div></div>
                            <span className="font-black text-sm">{p}%</span>
                        </div>
                    </div>
                </div>

                {loading ? <div className="text-center py-20"><i className="fa-solid fa-circle-notch fa-spin text-primary text-3xl"></i></div>
                : denied ? <EmptyState icon="fa-lock" title="لا يمكنك الوصول لمحتوى هذه الدورة" sub="تأكد من تفعيل اشتراكك أو تواصل مع الدعم." />
                : lectures.length === 0 ? <EmptyState icon="fa-film" title="لم تُضف حلقات بعد" sub="ترقّب المحتوى قريباً!" />
                : (
                    <div className="flex flex-col-reverse lg:flex-row gap-6">
                        <div className="w-full lg:w-1/3">
                            <div className="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 lg:sticky lg:top-24">
                                <h3 className="font-black text-gray-800 mb-4"><i className="fa-solid fa-list-ul text-primary ml-2"></i>الفهرس ({completed.length}/{lectures.length})</h3>
                                <div className="space-y-2 max-h-[60vh] overflow-y-auto pl-1">
                                    {lectures.map((lec, i) => {
                                        const done = completed.includes(lec.id), on = lec.id === activeId;
                                        return (
                                            <button key={lec.id} onClick={() => select(lec.id)} className={`w-full text-right p-3 rounded-2xl font-bold text-sm flex items-center gap-3 transition ${on ? "bg-primary text-white shadow-md" : "bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-100"}`}>
                                                <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 text-xs ${done ? "bg-green-500 text-white" : on ? "bg-white/20" : "bg-white text-gray-400 shadow-sm"}`}>
                                                    <i className={done ? "fa-solid fa-check" : lec.videoUrl ? "fa-solid fa-play" : "fa-solid fa-file-lines"}></i>
                                                </div>
                                                <span className="line-clamp-1">{i + 1}. {lec.title}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        <div className="w-full lg:w-2/3 space-y-6">
                            {active && <>
                                <div className="bg-white p-5 sm:p-8 rounded-[2rem] shadow-sm border border-gray-100">
                                    <p className="text-xs font-bold text-primary mb-1">الحلقة {idx + 1} من {lectures.length}</p>
                                    <h3 className="text-xl sm:text-2xl font-black text-gray-800 mb-5">{active.title}</h3>
                                    {active.videoUrl && <div className="w-full aspect-video bg-black rounded-2xl overflow-hidden mb-5"><iframe key={active.id} src={getEmbedUrl(active.videoUrl)} className="w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen></iframe></div>}
                                    {active.content && <div className="bg-gray-50 p-5 rounded-2xl border border-gray-100 text-gray-700 leading-loose text-sm sm:text-base">{active.content.split("\n").map((t, i) => <p key={i} className="mb-2">{t}</p>)}</div>}
                                    {active.fileUrl && <a href={active.fileUrl} target="_blank" className="mt-4 flex items-center gap-3 bg-blue-50 text-blue-700 p-4 rounded-2xl font-bold hover:bg-blue-100"><i className="fa-solid fa-file-arrow-down text-xl"></i>تحميل الملف المرفق</a>}
                                    <div className="flex flex-wrap gap-3 mt-6">
                                        <button onClick={() => select(lectures[idx - 1].id)} disabled={idx <= 0} className="px-5 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold disabled:opacity-30"><i className="fa-solid fa-arrow-right ml-1"></i>السابقة</button>
                                        <button onClick={toggleDone} className={`flex-1 py-3 rounded-xl font-black transition ${completed.includes(activeId) ? "bg-green-50 text-green-700 border border-green-200" : "bg-gradient-to-r from-primary to-secondary text-white shadow-lg"}`}>
                                            {completed.includes(activeId) ? <><i className="fa-solid fa-circle-check ml-1"></i>مكتملة</> : <><i className="fa-solid fa-check ml-1"></i>أنهيت الحلقة</>}
                                        </button>
                                        <button onClick={() => select(lectures[idx + 1].id)} disabled={idx >= lectures.length - 1} className="px-5 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold disabled:opacity-30">التالية<i className="fa-solid fa-arrow-left mr-1"></i></button>
                                    </div>
                                </div>
                                <div className="bg-white p-5 sm:p-8 rounded-[2rem] shadow-sm border border-gray-100">
                                    <h4 className="font-black text-xl text-gray-800 mb-5"><i className="fa-regular fa-comments text-primary ml-2"></i>مساحة النقاش</h4>
                                    <LectureComments courseId={course.id} lectureId={active.id} user={user} displayName={profile?.fullName || user.email.split("@")[0]} />
                                </div>
                            </>}
                        </div>
                    </div>
                )}
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}

if (window.__fbReady) boot();
else window.addEventListener("firebase-ready", boot, { once: true });
</script>
</body>
</html>
