        const firebaseConfig = {
            apiKey: "AIzaSyDwSZe5sUglFRmXKbGLqtS6_5qO1r5wf9o",
            authDomain: "ibda3-91fde.firebaseapp.com",
            projectId: "ibda3-91fde",
            storageBucket: "ibda3-91fde.firebasestorage.app",
            messagingSenderId: "203097189746",

        window.db = getFirestore(app);
        window.firebaseAPI = {

<body class="bg-slate-100 text-gray-800 antialiased selection:bg-primary selection:text-white">
<div id="root"></div>

<script type="text/babel" data-presets="react">
function boot() {
    const { useState, useEffect, useMemo, useRef } = React;
    const {
        onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
        collection, addDoc, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, onSnapshot, query, orderBy, where, limit,
        writeBatch, arrayUnion, arrayRemove
    } = window.firebaseAPI;
    const db = window.db, auth = window.auth;

    // ================== إعدادات المنصة ==================
    const SITE = {
        name: "منصة إبداع",
        logo: "https://i.ibb.co/3m1R0Vb/image.png",
        // القيم الافتراضية (تقدر تغيّرها من لوحة الإدارة > الإعدادات)
        bankName: "مركز إبداع ومواهب للتدريب",
        iban: "SA1080000216608016625329",
        whatsapp: "966510785633"
    };

    const GRADES = ["الأول الابتدائي","الثاني الابتدائي","الثالث الابتدائي","الرابع الابتدائي","الخامس الابتدائي","السادس الابتدائي","الأول المتوسط","الثاني المتوسط","الثالث المتوسط","الأول الثانوي","الثاني الثانوي","الثالث الثانوي","أخرى"];

    // ================== أدوات مساعدة ==================
    const nowISO = () => new Date().toISOString();
    const toast = (msg, type = "success") => window.dispatchEvent(new CustomEvent("app-toast", { detail: { msg, type } }));
    const isAdminRole = (r) => r === "admin" || r === "super_admin";
    const formatPrice = (c) => (Number(c?.priceAmount) > 0 ? `${Number(c.priceAmount).toLocaleString("ar-SA")} ر.س` : (c?.price || "—"));
    const priceNumber = (c) => Number(c?.priceAmount) || parseFloat(String(c?.price || "").replace(/[^\d.]/g, "")) || 0;
    const sortLectures = (list) => [...list].sort((a, b) => ((a.order ?? 1e9) - (b.order ?? 1e9)) || String(a.createdAt).localeCompare(String(b.createdAt)));
    const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString("ar-SA", { day: "numeric", month: "short" }); } catch { return ""; } };
    const fmtTime = (iso) => { try { return new Date(iso).toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" }); } catch { return ""; } };
    const waLink = (phone, text) => `https://wa.me/${String(phone).replace(/\D/g, "")}?text=${encodeURIComponent(text)}`;

    const getEmbedUrl = (url) => {
        if (!url) return "";
        try {
            const u = new URL(url);
            let id = null;
            if (u.hostname.includes("youtu.be")) id = u.pathname.slice(1);
            else if (u.hostname.includes("youtube.com")) {
                if (u.pathname === "/watch") id = u.searchParams.get("v");
                else if (/^\/(shorts|embed|live)\//.test(u.pathname)) id = u.pathname.split("/")[2];
            }
            return id ? `https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1` : url;
        } catch { return url; }
    };

    const handleImageUpload = (e, callback, maxSize = 800) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;
                if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
                else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                const canvas = document.createElement("canvas");
                canvas.width = width; canvas.height = height;
                canvas.getContext("2d").drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL("image/jpeg", 0.7));
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    };

    function useSettings() {
        const [s, setS] = useState({});
        useEffect(() => onSnapshot(doc(db, "settings", "site"), (snap) => setS(snap.exists() ? snap.data() : {}), () => {}), []);
        return {
            bankName: s.bankName || SITE.bankName,
            iban: s.iban || SITE.iban,
            whatsapp: s.whatsapp || SITE.whatsapp,
            announcement: s.announcement || ""
        };
    }

    // ================== مكونات عامة ==================
    const inputCls = "w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary text-sm transition";
    const Field = ({ label, children }) => <div><label className="text-xs font-bold text-gray-500 mb-1 block">{label}</label>{children}</div>;

    function ToastHost() {
        const [items, setItems] = useState([]);
        useEffect(() => {
            const h = (e) => {
                const id = Math.random();
                setItems((x) => [...x, { id, ...e.detail }]);
                setTimeout(() => setItems((x) => x.filter((i) => i.id !== id)), 4000);
            };
            window.addEventListener("app-toast", h);
            return () => window.removeEventListener("app-toast", h);
        }, []);
        return (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] space-y-2 w-[92vw] max-w-sm pointer-events-none">
                {items.map((t) => (
                    <div key={t.id} className={`px-4 py-3 rounded-2xl shadow-xl text-sm font-bold text-white flex items-center gap-2 animate-[fadeInUp_.3s_ease-out] ${t.type === "error" ? "bg-red-600" : t.type === "info" ? "bg-slate-800" : "bg-emerald-600"}`}>
                        <i className={`fa-solid ${t.type === "error" ? "fa-circle-exclamation" : t.type === "info" ? "fa-circle-info" : "fa-circle-check"}`}></i>{t.msg}
                    </div>
                ))}
            </div>
        );
    }

    function Modal({ onClose, children, max = "max-w-lg", z = "z-50" }) {
        useEffect(() => {
            const h = (e) => e.key === "Escape" && onClose();
            window.addEventListener("keydown", h);
            document.body.style.overflow = "hidden";
            return () => { window.removeEventListener("keydown", h); document.body.style.overflow = ""; };
        }, []);
        return (
            <div className={`fixed inset-0 bg-dark/80 backdrop-blur-sm flex items-start sm:items-center justify-center p-4 ${z} overflow-y-auto animate-[fadeIn_.2s_ease-out]`} onClick={onClose}>
                <div className={`bg-white rounded-[2rem] shadow-2xl w-full ${max} relative my-8 animate-[fadeInUp_.3s_ease-out] overflow-hidden`} onClick={(e) => e.stopPropagation()}>
                    <button onClick={onClose} className="absolute top-4 left-4 z-20 w-9 h-9 bg-black/40 text-white rounded-full flex items-center justify-center hover:bg-black transition"><i className="fa-solid fa-xmark"></i></button>
                    {children}
                </div>
            </div>
        );
    }

    function ImagePicker({ value, onChange, round = false, label = "اضغط لاختيار صورة" }) {
        return (
            <div className="relative border-2 border-dashed border-gray-300 rounded-xl p-4 text-center hover:bg-gray-50 transition cursor-pointer">
                <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, onChange, round ? 200 : 800)} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                {value
                    ? <img src={value} className={`${round ? "w-14 h-14 rounded-full" : "h-24 rounded-lg"} object-cover mx-auto shadow`} />
                    : <div className="text-gray-400"><i className="fa-solid fa-cloud-arrow-up text-2xl mb-1"></i><p className="text-xs font-bold">{label}</p></div>}
            </div>
        );
    }

    function ProgressBar({ value, className = "" }) {
        return (
            <div className={`w-full h-2 bg-gray-100 rounded-full overflow-hidden ${className}`}>
                <div className="h-full bg-gradient-to-l from-primary to-secondary rounded-full transition-all duration-700" style={{ width: `${Math.min(100, Math.max(0, value))}%` }}></div>
            </div>
        );
    }

    function EmptyState({ icon, title, sub, children }) {
        return (
            <div className="bg-white rounded-[2rem] border border-gray-100 p-10 text-center shadow-sm">
                <div className="w-20 h-20 bg-gray-50 text-gray-300 rounded-full flex items-center justify-center text-3xl mx-auto mb-4"><i className={`fa-solid ${icon}`}></i></div>
                <h3 className="text-lg font-black text-gray-700 mb-1">{title}</h3>
                {sub && <p className="text-gray-500 text-sm mb-4">{sub}</p>}
                {children}
            </div>
        );
    }

    // ================== التطبيق ==================
    function App() {
        const [user, setUser] = useState(null);
        const [role, setRole] = useState(null);
        const [loading, setLoading] = useState(true);

        useEffect(() => onAuthStateChanged(auth, async (u) => {
            setUser(u);
            if (u) {
                try {
                    const d = await getDoc(doc(db, "users", u.uid));
                    setRole(d.exists() ? (d.data().role || "student") : "student");
                } catch { setRole("student"); }
            } else setRole(null);
            setLoading(false);
        }), []);


        let content;
        if (loading) content = (
            <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50">
                <img src={SITE.logo} className="w-20 h-20 rounded-full object-cover border-4 border-primary/20 mb-5 animate-pulse" />
                <i className="fa-solid fa-circle-notch fa-spin text-primary text-3xl mb-3"></i>
                <h2 className="text-lg font-bold text-gray-600">جاري تحميل {SITE.name}...</h2>
            </div>
        );
        else if (!user) content = <Login />;
        else if (isAdminRole(role)) content = <AdminDashboard user={user} role={role} />;
        else content = <StudentDashboard user={user} />;

        return <>{content}<ToastHost /></>;
    }

    // ================== تسجيل الدخول ==================
    function Login() {
        const [username, setUsername] = useState("");
        const [password, setPassword] = useState("");
        const [showPass, setShowPass] = useState(false);
        const [isRegister, setIsRegister] = useState(false);
        const [error, setError] = useState("");
        const [loading, setLoading] = useState(false);

        const handleSubmit = async (e) => {
            e.preventDefault();
            setError("");
            const uname = username.trim().toLowerCase();
            if (isRegister && !/^[a-z0-9._-]{3,30}$/.test(uname)) { setError("اسم المستخدم بحروف إنجليزية أو أرقام فقط (3 أحرف على الأقل، بدون مسافات)"); return; }
            if (isRegister && password.length < 6) { setError("كلمة المرور يجب ألا تقل عن 6 أحرف"); return; }
            setLoading(true);
            const email = uname + "@ebdaa.com";
            try {
                if (isRegister) {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", cred.user.uid), { username: username.trim(), role: "student", profileComplete: false, createdAt: nowISO() });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) {
                const map = {
                    "auth/invalid-credential": "اسم المستخدم أو كلمة المرور غير صحيحة",
                    "auth/wrong-password": "كلمة المرور غير صحيحة",
                    "auth/user-not-found": "لا يوجد حساب بهذا الاسم",
                    "auth/email-already-in-use": "اسم المستخدم محجوز، اختر اسماً آخر",
                    "auth/invalid-email": "اسم المستخدم غير صالح",
                    "auth/too-many-requests": "محاولات كثيرة، حاول بعد قليل",
                    "auth/network-request-failed": "تحقق من اتصال الإنترنت"
                };
                setError(map[err.code] || "حدث خطأ، حاول مرة أخرى");
            }
            setLoading(false);
        };

        return (
            <div className="flex min-h-screen bg-slate-100">
                <div className="hidden lg:flex w-1/2 bg-gradient-to-br from-primary to-secondary text-white flex-col justify-center items-center p-12 relative overflow-hidden">
                    <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-white opacity-10 rounded-full blur-3xl"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-accent opacity-20 rounded-full blur-3xl"></div>
                    <img src={SITE.logo} className="w-32 h-32 object-cover rounded-full border-4 border-white/30 shadow-2xl mb-8 z-10" />
                    <h1 className="text-5xl font-black mb-4 z-10 text-center leading-tight">بوابتك نحو التميز<br />والإبداع</h1>
                    <p className="text-lg text-indigo-100 z-10 text-center max-w-md">دورات تفاعلية، متابعة لتقدمك، ودعم مباشر من فريق {SITE.name}.</p>
                    <div className="grid grid-cols-3 gap-4 mt-10 z-10 w-full max-w-md">
                        {[["fa-video", "محتوى مرئي"], ["fa-chart-line", "تتبع التقدم"], ["fa-headset", "دعم مباشر"]].map(([ic, t]) => (
                            <div key={t} className="bg-white/10 backdrop-blur rounded-2xl p-4 text-center border border-white/20"><i className={`fa-solid ${ic} text-2xl mb-2`}></i><p className="text-xs font-bold">{t}</p></div>
                        ))}
                    </div>
                </div>
                <div className="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12">
                    <div className="w-full max-w-md bg-white p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 animate-[fadeInUp_.4s_ease-out]">
                        <div className="text-center mb-8">
                            <img src={SITE.logo} className="w-16 h-16 object-cover rounded-full mx-auto mb-4 lg:hidden border-2 border-primary" />
                            <h2 className="text-2xl font-bold text-gray-900">{isRegister ? "إنشاء حساب جديد" : "تسجيل الدخول"}</h2>
                            <p className="text-sm text-gray-500 mt-1">{isRegister ? "انضم إلينا وابدأ رحلتك" : `مرحباً بك مجدداً في ${SITE.name}`}</p>
                        </div>
                        {error && <div className="bg-red-50 text-red-600 p-3 rounded-xl text-sm font-bold mb-6 flex items-center gap-2"><i className="fa-solid fa-circle-exclamation"></i>{error}</div>}
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5"><i className="fa-solid fa-user text-gray-400 ml-1"></i> اسم المستخدم</label>
                                <input type="text" required autoComplete="username" value={username} onChange={(e) => setUsername(e.target.value)} className={inputCls + " py-3"} placeholder="مثال: ahmed2015" dir="ltr" />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5"><i className="fa-solid fa-lock text-gray-400 ml-1"></i> كلمة المرور</label>
                                <div className="relative">
                                    <input type={showPass ? "text" : "password"} required autoComplete={isRegister ? "new-password" : "current-password"} value={password} onChange={(e) => setPassword(e.target.value)} className={inputCls + " py-3 pl-12"} placeholder="••••••••" dir="ltr" />
                                    <button type="button" onClick={() => setShowPass(!showPass)} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary w-8 h-8"><i className={`fa-solid ${showPass ? "fa-eye-slash" : "fa-eye"}`}></i></button>
                                </div>
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-gradient-to-r from-primary to-secondary text-white py-3.5 rounded-xl font-bold text-lg hover:shadow-lg hover:opacity-90 transition-all disabled:opacity-60">
                                {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : (isRegister ? "إنشاء الحساب" : "دخول المنصة")}
                            </button>
                        </form>
                        <div className="mt-8 text-center">
                            <button onClick={() => { setIsRegister(!isRegister); setError(""); }} className="text-sm font-bold text-primary hover:text-secondary transition-colors">
                                {isRegister ? "لديك حساب بالفعل؟ سجل دخولك" : "ليس لديك حساب؟ أنشئ حساباً جديداً"}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    // ================== لوحة الإدارة ==================
    function AdminDashboard({ user, role }) {
        const [tab, setTab] = useState("overview");
        const [courses, setCourses] = useState([]);
        const [requests, setRequests] = useState([]);
        const [users, setUsers] = useState([]);
        const [promos, setPromos] = useState([]);
        const [socialLinks, setSocialLinks] = useState([]);
        const [chatMeta, setChatMeta] = useState([]);
        const [lecturesCourse, setLecturesCourse] = useState(null);
        const [chatStudent, setChatStudent] = useState(null);
        const [studentModal, setStudentModal] = useState(null);

        useEffect(() => {
            const map = (set) => (snap) => set(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
            const err = () => {};
            const unsubs = [
                onSnapshot(query(collection(db, "courses"), orderBy("createdAt", "desc")), map(setCourses), err),
                onSnapshot(query(collection(db, "enrollmentRequests"), orderBy("createdAt", "desc")), map(setRequests), err),
                onSnapshot(collection(db, "users"), map(setUsers), err),
                onSnapshot(query(collection(db, "promos"), orderBy("createdAt", "desc")), map(setPromos), err),
                onSnapshot(query(collection(db, "socialLinks"), orderBy("createdAt", "asc")), map(setSocialLinks), err),
                onSnapshot(collection(db, "chatMeta"), map(setChatMeta), err),
            ];
            return () => unsubs.forEach((u) => u());
        }, []);

        const students = users.filter((u) => !isAdminRole(u.role));
        const pendingCount = requests.filter((r) => r.status === "pending").length;
        const unreadChats = chatMeta.filter((m) => m.unreadAdmin).length;

        const openChat = (st) => { setChatStudent(st); setTab("supportChats"); setStudentModal(null); };

        const TABS = [
            { id: "overview", icon: "fa-chart-pie", label: "نظرة عامة" },
            { id: "courses", icon: "fa-book-open", label: "الدورات" },
            { id: "requests", icon: "fa-inbox", label: "الطلبات", badge: pendingCount },
            { id: "students", icon: "fa-user-graduate", label: "الطلاب" },
            { id: "supportChats", icon: "fa-comments", label: "المحادثات", badge: unreadChats },
            { id: "promos", icon: "fa-bullhorn", label: "الإعلانات" },
            { id: "social", icon: "fa-hashtag", label: "التواصل" },
            { id: "settings", icon: "fa-gear", label: "الإعدادات" },
        ];

        return (
            <div className="flex flex-col lg:flex-row min-h-screen bg-slate-50">
                <aside className="w-full lg:w-72 bg-dark text-white flex flex-col shadow-2xl z-20 lg:h-screen lg:sticky lg:top-0">
                    <div className="p-4 lg:p-6 flex items-center justify-between gap-4 border-b border-gray-800">
                        <div className="flex items-center gap-3">
                            <img src={SITE.logo} className="w-11 h-11 lg:w-14 lg:h-14 object-cover rounded-full border-2 border-primary shadow-[0_0_15px_rgba(79,70,229,0.5)]" />
                            <div>
                                <h1 className="text-lg lg:text-xl font-black">لوحة الإدارة</h1>
                                <p className="text-xs text-gray-400"><i className="fa-solid fa-crown text-yellow-500 ml-1"></i>{SITE.name}</p>
                            </div>
                        </div>
                        <button onClick={() => signOut(auth)} className="lg:hidden w-10 h-10 bg-red-500/10 text-red-400 rounded-full"><i className="fa-solid fa-power-off"></i></button>
                    </div>
                    <nav className="flex lg:flex-col gap-2 px-3 lg:px-4 py-3 lg:py-6 overflow-x-auto no-scrollbar lg:flex-1">
                        {TABS.map((t) => (

    function StatCard({ icon, label, value, color, onClick }) {
        return (
            <button onClick={onClick} className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 text-right hover:shadow-md transition w-full">
                <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-xl ${color}`}><i className={`fa-solid ${icon}`}></i></div>
                <div><p className="text-xs text-gray-400 font-bold">{label}</p><p className="text-2xl font-black text-gray-800">{value}</p></div>
            </button>
        );
    }

    function AdminOverview({ courses, requests, students, chatMeta, setTab }) {
        const approved = requests.filter((r) => r.status === "approved");
        const pending = requests.filter((r) => r.status === "pending");
        const courseById = Object.fromEntries(courses.map((c) => [c.id, c]));
        const revenue = approved.reduce((s, r) => s + priceNumber(courseById[r.courseId]), 0);
        const enrollCount = {};
        approved.forEach((r) => (enrollCount[r.courseId] = (enrollCount[r.courseId] || 0) + 1));
        const top = courses.map((c) => ({ ...c, n: enrollCount[c.id] || 0 })).sort((a, b) => b.n - a.n).slice(0, 5);
        const maxN = Math.max(1, ...top.map((t) => t.n));
        const weekAgo = Date.now() - 7 * 864e5;
        const newStudents = students.filter((s) => s.createdAt && new Date(s.createdAt).getTime() > weekAgo).length;

        return (
            <div className="space-y-8">
                <div>
                    <h2 className="text-2xl sm:text-3xl font-black text-gray-800">نظرة عامة 👋</h2>
                    <p className="text-gray-500 text-sm mt-1">ملخص سريع لأداء المنصة</p>
                </div>
                <div className="grid grid-cols-2 xl:grid-cols-4 gap-4">
                    <StatCard icon="fa-user-graduate" label="إجمالي الطلاب" value={students.length} color="bg-indigo-50 text-primary" onClick={() => setTab("students")} />
                    <StatCard icon="fa-book-open" label="الدورات" value={courses.length} color="bg-purple-50 text-secondary" onClick={() => setTab("courses")} />
                    <StatCard icon="fa-hourglass-half" label="طلبات معلقة" value={pending.length} color="bg-yellow-50 text-yellow-600" onClick={() => setTab("requests")} />
                    <StatCard icon="fa-sack-dollar" label="الإيرادات التقديرية" value={`${revenue.toLocaleString("ar-SA")} ر.س`} color="bg-green-50 text-green-600" />
                </div>
                <div className="grid lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <h3 className="font-black text-gray-800 mb-5"><i className="fa-solid fa-trophy text-yellow-500 ml-2"></i>الدورات الأكثر اشتراكاً</h3>
                        {top.length === 0 ? <p className="text-gray-400 text-sm">لا توجد بيانات بعد</p> : (
                            <div className="space-y-4">
                                {top.map((c) => (
                                    <div key={c.id}>
                                        <div className="flex justify-between text-sm font-bold mb-1"><span className="text-gray-700 line-clamp-1">{c.title}</span><span className="text-primary">{c.n} مشترك</span></div>
                                        <ProgressBar value={(c.n / maxN) * 100} />
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                        <h3 className="font-black text-gray-800"><i className="fa-solid fa-bolt text-primary ml-2"></i>نشاط سريع</h3>
                        <div className="flex justify-between text-sm"><span className="text-gray-500 font-bold">طلاب جدد هذا الأسبوع</span><span className="font-black">{newStudents}</span></div>
                        <div className="flex justify-between text-sm"><span className="text-gray-500 font-bold">اشتراكات مفعّلة</span><span className="font-black">{approved.length}</span></div>
                        <div className="flex justify-between text-sm"><span className="text-gray-500 font-bold">محادثات غير مقروءة</span><span className="font-black text-red-500">{chatMeta.filter((m) => m.unreadAdmin).length}</span></div>
                    </div>
                </div>
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="font-black text-gray-800">أحدث الطلبات المعلقة</h3>
                        <button onClick={() => setTab("requests")} className="text-primary text-sm font-bold">عرض الكل <i className="fa-solid fa-arrow-left text-xs"></i></button>
                    </div>
                    {pending.length === 0 ? <p className="text-gray-400 text-sm">لا توجد طلبات معلقة 🎉</p> : pending.slice(0, 5).map((r) => (
                        <div key={r.id} className="flex justify-between items-center py-3 border-b last:border-0 text-sm">
                            <span className="font-bold">{r.studentName}</span><span className="text-gray-500 line-clamp-1">{r.courseTitle}</span><span className="text-gray-400 text-xs">{fmtDate(r.createdAt)}</span>
                        </div>
                    ))}
                </div>
            </div>
        );
    }

    function CourseForm({ initial = {}, onSubmit, submitLabel }) {
        const [f, setF] = useState({
            title: "", instructor: "", priceAmount: "", duration: "", targetAudience: "", category: "", desc: "", previewVideoUrl: "", imageUrl: "", published: true,
            ...initial,
            priceAmount: initial.priceAmount ?? (priceNumber(initial) || ""),
        });
        const [saving, setSaving] = useState(false);
        const set = (k) => (e) => setF({ ...f, [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value });
        const submit = async (e) => {
            e.preventDefault();
            setSaving(true);
            const amount = Number(f.priceAmount) || 0;
            const data = {
                title: f.title.trim(), instructor: f.instructor.trim(), priceAmount: amount, price: amount > 0 ? `${amount} ريال` : "مجاناً",
                duration: f.duration, targetAudience: f.targetAudience, category: f.category.trim(), desc: f.desc,
                previewVideoUrl: f.previewVideoUrl || "", imageUrl: f.imageUrl || "", published: !!f.published
            };
            try { await onSubmit(data); } catch (err) { toast("تعذر الحفظ — قد تكون الصورة كبيرة", "error"); }
            setSaving(false);
        };
        return (
            <form onSubmit={submit} className="space-y-4">
                <Field label="اسم الدورة"><input required value={f.title} onChange={set("title")} className={inputCls} /></Field>
                <div className="grid grid-cols-2 gap-3">
                    <Field label="المدرب"><input required value={f.instructor} onChange={set("instructor")} className={inputCls} /></Field>
                    <Field label="السعر (ريال)"><input type="number" min="0" step="1" required value={f.priceAmount} onChange={set("priceAmount")} className={inputCls} dir="ltr" /></Field>
                </div>
                <div className="grid grid-cols-2 gap-3">
                    <Field label="المدة"><input required value={f.duration} onChange={set("duration")} className={inputCls} placeholder="مثال: 8 أسابيع" /></Field>
                    <Field label="الفئة المستهدفة"><input required value={f.targetAudience} onChange={set("targetAudience")} className={inputCls} placeholder="مثال: الصف السادس" /></Field>
                </div>
                <Field label="التصنيف"><input value={f.category} onChange={set("category")} className={inputCls} placeholder="مثال: موهبة، رياضيات، قدرات" /></Field>
                <Field label="الوصف التفصيلي"><textarea required value={f.desc} onChange={set("desc")} className={inputCls + " h-24"}></textarea></Field>
                <Field label="رابط يوتيوب التعريفي"><input type="url" value={f.previewVideoUrl} onChange={set("previewVideoUrl")} className={inputCls} dir="ltr" /></Field>
                <Field label="صورة الغلاف (تُضغط تلقائياً)"><ImagePicker value={f.imageUrl} onChange={(v) => setF({ ...f, imageUrl: v })} /></Field>
                <label className="flex items-center gap-3 bg-gray-50 p-3 rounded-xl cursor-pointer">
                    <input type="checkbox" checked={f.published} onChange={set("published")} className="w-5 h-5 accent-primary" />
                    <span className="text-sm font-bold text-gray-700">منشورة وظاهرة للطلاب</span>
                </label>
                <button type="submit" disabled={saving} className="w-full bg-primary text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg disabled:opacity-60">
                    {saving ? <i className="fa-solid fa-spinner fa-spin"></i> : submitLabel}
                </button>
            </form>
        );
    }

                        {courses.map((c) => (
                            <div key={c.id} className={`bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col transition hover:shadow-md group ${c.published === false ? "border-dashed border-gray-300 opacity-80" : "border-gray-100"}`}>
                                <div className="h-40 bg-gray-200 relative overflow-hidden">

                                    <div className="absolute top-3 left-3 bg-white/90 text-green-700 text-xs font-black px-3 py-1 rounded-full shadow">{formatPrice(c)}</div>

                                    <div className="mt-auto grid grid-cols-4 gap-2">

                                        <button onClick={() => setEditing(c)} className="bg-gray-100 text-gray-700 py-2 rounded-xl hover:bg-gray-200 transition" title="تعديل"><i className="fa-solid fa-pen"></i></button>
                                        <button onClick={() => togglePublish(c)} className="bg-gray-100 text-gray-700 py-2 rounded-xl hover:bg-gray-200 transition" title={c.published === false ? "إظهار" : "إخفاء"}><i className={`fa-solid ${c.published === false ? "fa-eye" : "fa-eye-slash"}`}></i></button>
                                        <button onClick={() => remove(c)} className="col-span-2 bg-red-50 text-red-600 py-2 rounded-xl font-bold text-sm hover:bg-red-100 transition"><i className="fa-solid fa-trash-can ml-1"></i>حذف</button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
                {editing && (

                            <h3 className="text-2xl font-black text-gray-800 mb-6"><i className="fa-solid fa-pen-to-square text-primary ml-2"></i>تعديل الدورة</h3>
                            <CourseForm initial={editing} onSubmit={update} submitLabel="حفظ التحديثات" />
                        </div>
                    </Modal>
                )}
            </div>
        );

    function LectureComments({ courseId, lectureId, user, displayName, isAdmin }) {
        const [comments, setComments] = useState([]);
        const [text, setText] = useState("");
        useEffect(() => onSnapshot(
            query(collection(db, "courses", courseId, "lectures", lectureId, "comments"), orderBy("createdAt", "asc")),
            (s) => setComments(s.docs.map((d) => ({ id: d.id, ...d.data() }))), () => {}
        ), [courseId, lectureId]);

        const send = async (e) => {
            e.preventDefault();
            const t = text.trim(); if (!t) return;
            setText("");
            await addDoc(collection(db, "courses", courseId, "lectures", lectureId, "comments"), {
                userId: user.uid, userName: isAdmin ? "الإدارة" : displayName, text: t, isAdminReply: !!isAdmin, createdAt: nowISO()
            });
        };
        const remove = async (id) => { if (confirm("حذف التعليق؟")) await deleteDoc(doc(db, "courses", courseId, "lectures", lectureId, "comments", id)); };

        return (
            <div>
                <div className="space-y-3 mb-5 max-h-[400px] overflow-y-auto pl-1">
                    {comments.length === 0 && <div className="text-center py-6 text-gray-400"><i className="fa-regular fa-comment-dots text-3xl mb-2 opacity-50"></i><p className="font-bold text-sm">{isAdmin ? "لا توجد تعليقات على هذه الحلقة" : "كن أول من يشارك في النقاش!"}</p></div>}
                    {comments.map((c) => (
                        <div key={c.id} className={`flex ${c.isAdminReply ? "justify-end" : "justify-start"}`}>
                            <div className={`p-4 rounded-2xl max-w-[85%] text-sm group relative ${c.isAdminReply ? "bg-indigo-50 border border-indigo-100 rounded-tl-sm" : "bg-gray-50 border border-gray-100 rounded-tr-sm"}`}>
                                <div className="flex items-center gap-2 mb-1.5">
                                    <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] ${c.isAdminReply ? "bg-primary text-white" : "bg-gray-300 text-gray-600"}`}><i className={c.isAdminReply ? "fa-solid fa-crown" : "fa-solid fa-user"}></i></div>
                                    <span className="font-black text-xs text-gray-900">{c.userName}</span>
                                    <span className="text-[10px] text-gray-400">{fmtDate(c.createdAt)}</span>
                                    {(isAdmin || c.userId === user.uid) && <button onClick={() => remove(c.id)} className="text-gray-300 hover:text-red-500 text-xs mr-auto"><i className="fa-solid fa-trash"></i></button>}
                                </div>
                                <p className="leading-relaxed whitespace-pre-wrap">{c.text}</p>
                            </div>
                        </div>
                    ))}
                </div>
                <form onSubmit={send} className="flex gap-2">
                    <input value={text} onChange={(e) => setText(e.target.value)} className={inputCls + " py-3.5"} placeholder={isAdmin ? "اكتب رداً بصفتك الإدارة..." : "اكتب سؤالك أو ملاحظتك..."} />
                    <button type="submit" disabled={!text.trim()} className="bg-primary text-white px-6 rounded-xl font-black hover:bg-indigo-700 transition disabled:opacity-50"><i className="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>
        );
    }

    function AdminLecturesManager({ course, user, onBack }) {
        const [lectures, setLectures] = useState([]);
        const empty = { title: "", content: "", videoUrl: "", fileUrl: "" };
        const [form, setForm] = useState(empty);
        const [editingId, setEditingId] = useState(null);
        const [openComments, setOpenComments] = useState(null);

        useEffect(() => onSnapshot(
            query(collection(db, "courses", course.id, "lectures"), orderBy("createdAt", "asc")),
            (s) => setLectures(sortLectures(s.docs.map((d) => ({ id: d.id, ...d.data() })))), () => {}
        ), [course.id]);

        const submit = async (e) => {
            e.preventDefault();
            if (editingId) {
                await updateDoc(doc(db, "courses", course.id, "lectures", editingId), form);
                toast("تم تحديث الحلقة");
            } else {
                await addDoc(collection(db, "courses", course.id, "lectures"), { ...form, order: lectures.length, createdAt: nowISO() });
                toast("تمت إضافة الحلقة");
            }
            setForm(empty); setEditingId(null);
        };
        const startEdit = (l) => { setEditingId(l.id); setForm({ title: l.title || "", content: l.content || "", videoUrl: l.videoUrl || "", fileUrl: l.fileUrl || "" }); window.scrollTo({ top: 0, behavior: "smooth" }); };
        const remove = async (id) => { if (confirm("حذف الحلقة؟")) await deleteDoc(doc(db, "courses", course.id, "lectures", id)); };
        const move = async (idx, dir) => {
            const arr = [...lectures];
            const j = idx + dir; if (j < 0 || j >= arr.length) return;
            [arr[idx], arr[j]] = [arr[j], arr[idx]];
            const batch = writeBatch(db);
            arr.forEach((l, i) => batch.update(doc(db, "courses", course.id, "lectures", l.id), { order: i }));
            await batch.commit();
        };

        return (
            <div>
                <button onClick={onBack} className="mb-6 flex items-center gap-2 bg-white border border-gray-200 text-gray-700 px-5 py-2.5 rounded-full font-black text-sm hover:bg-gray-50 transition shadow-sm"><i className="fa-solid fa-arrow-right"></i> العودة للدورات</button>
                <div className="bg-gradient-to-r from-primary to-secondary p-6 rounded-3xl shadow-lg mb-8 text-white flex items-center gap-5 relative overflow-hidden">
                    {course.imageUrl ? <img src={course.imageUrl} className="w-20 h-20 object-cover rounded-2xl shadow-xl z-10 border-2 border-white/20" /> : <div className="w-20 h-20 bg-white/10 rounded-2xl flex items-center justify-center z-10"><i className="fa-solid fa-video text-3xl"></i></div>}
                    <div className="z-10">
                        <h2 className="text-2xl sm:text-3xl font-black mb-1">{course.title}</h2>
                        <p className="text-indigo-100 font-bold">{lectures.length} حلقة • إدارة المحتوى والنقاشات</p>
                    </div>
                </div>
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 h-fit">
                        <h3 className="text-xl font-black text-gray-800 mb-6">
                            <i className={`fa-solid ${editingId ? "fa-pen-to-square" : "fa-plus-circle"} text-primary ml-2`}></i>{editingId ? "تعديل الحلقة" : "إضافة حلقة جديدة"}
                        </h3>
                        <form onSubmit={submit} className="space-y-4">
                            <Field label="عنوان الحلقة"><input required value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} className={inputCls} /></Field>
                            <Field label="رابط الفيديو (يوتيوب)"><input type="url" value={form.videoUrl} onChange={(e) => setForm({ ...form, videoUrl: e.target.value })} className={inputCls} dir="ltr" /></Field>
                            <Field label="رابط ملف مرفق (PDF / Drive) — اختياري"><input type="url" value={form.fileUrl} onChange={(e) => setForm({ ...form, fileUrl: e.target.value })} className={inputCls} dir="ltr" /></Field>
                            <Field label="المحتوى / الوصف"><textarea required value={form.content} onChange={(e) => setForm({ ...form, content: e.target.value })} className={inputCls + " h-28"}></textarea></Field>
                            <button type="submit" className="w-full bg-primary text-white py-3 rounded-xl font-black shadow-lg hover:bg-indigo-700 transition">{editingId ? "حفظ التعديل" : "نشر الحلقة"}</button>
                            {editingId && <button type="button" onClick={() => { setEditingId(null); setForm(empty); }} className="w-full bg-gray-100 text-gray-600 py-2.5 rounded-xl font-bold">إلغاء التعديل</button>}
                        </form>
                    </div>

    function AdminRequests({ requests, courses, onProfile, onChat }) {
        const [filter, setFilter] = useState("pending");
        const [search, setSearch] = useState("");
        const list = requests.filter((r) => (filter === "all" || r.status === filter) && (`${r.studentName} ${r.courseTitle}`).includes(search.trim()));
        const counts = { pending: 0, approved: 0, rejected: 0 };
        requests.forEach((r) => counts[r.status] !== undefined && counts[r.status]++);

        const approve = async (r) => {
            const batch = writeBatch(db);
            batch.set(doc(db, "users", r.studentId, "enrolledCourses", r.courseId), { enrolledAt: nowISO(), via: "bank" });
            batch.update(doc(db, "enrollmentRequests", r.id), { status: "approved", decidedAt: nowISO() });
            await batch.commit();
            toast(`تم تفعيل ${r.courseTitle} لـ ${r.studentName}`);
        };
        const reject = async (r) => {
            const reason = prompt("سبب الرفض (يظهر للطالب):", "لم يتم استلام الحوالة");
            if (reason === null) return;
            await updateDoc(doc(db, "enrollmentRequests", r.id), { status: "rejected", rejectReason: reason, decidedAt: nowISO() });
            toast("تم رفض الطلب", "info");
        };
        const revoke = async (r) => {
            if (!confirm(`إلغاء اشتراك ${r.studentName} في ${r.courseTitle}؟`)) return;
            const batch = writeBatch(db);
            batch.delete(doc(db, "users", r.studentId, "enrolledCourses", r.courseId));
            batch.update(doc(db, "enrollmentRequests", r.id), { status: "rejected", rejectReason: "تم إلغاء الاشتراك", decidedAt: nowISO() });
            await batch.commit();
            toast("تم إلغاء الاشتراك", "info");
        };
        const remove = async (r) => { if (confirm("حذف الطلب نهائياً؟")) await deleteDoc(doc(db, "enrollmentRequests", r.id)); };

        const chips = [["pending", "معلقة", "fa-hourglass-half"], ["approved", "مفعّلة", "fa-check"], ["rejected", "مرفوضة", "fa-xmark"], ["all", "الكل", "fa-list"]];
        return (
            <div className="bg-white p-5 lg:p-8 rounded-3xl shadow-sm border border-gray-100">
                <h2 className="text-2xl font-black text-gray-800 mb-6"><i className="fa-solid fa-inbox text-primary ml-2"></i>طلبات الانضمام</h2>
                <div className="flex flex-col sm:flex-row gap-3 mb-6">
                    <div className="flex gap-2 overflow-x-auto no-scrollbar">
                        {chips.map(([k, l, ic]) => (
                            <button key={k} onClick={() => setFilter(k)} className={`shrink-0 px-4 py-2 rounded-full text-sm font-bold transition ${filter === k ? "bg-primary text-white" : "bg-gray-100 text-gray-600 hover:bg-gray-200"}`}>
                                <i className={`fa-solid ${ic} ml-1`}></i>{l}{k !== "all" && ` (${counts[k]})`}
                            </button>
                        ))}
                    </div>
                    <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="بحث بالاسم أو الدورة..." className={inputCls + " sm:max-w-xs sm:mr-auto"} />
                </div>
                {list.length === 0 && <div className="text-center py-12 text-gray-400"><i className="fa-solid fa-check-circle text-5xl mb-3 opacity-50"></i><p className="font-bold">لا توجد طلبات هنا</p></div>}
                <div className="grid gap-3">
                    {list.map((r) => (
                        <div key={r.id} className="p-4 border border-gray-100 rounded-2xl bg-gray-50 flex flex-col md:flex-row md:items-center justify-between gap-4 hover:bg-white hover:shadow-md transition">
                            <div className="flex items-center gap-4 min-w-0">
                                <div className="w-11 h-11 shrink-0 bg-indigo-100 text-primary rounded-full flex items-center justify-center"><i className="fa-solid fa-user-graduate"></i></div>
                                <div className="min-w-0">
                                    <p className="font-black text-gray-800">{r.studentName}</p>
                                    <p className="text-sm text-gray-500">الدورة: <span className="text-primary font-bold">{r.courseTitle}</span> • {fmtDate(r.createdAt)}</p>
                                    {r.status === "rejected" && r.rejectReason && <p className="text-xs text-red-500 font-bold mt-1">السبب: {r.rejectReason}</p>}
                                </div>
                            </div>
                            <div className="flex flex-wrap items-center gap-2 justify-end">
                                <button onClick={() => onProfile(r.studentId)} className="bg-white border text-gray-700 w-10 h-10 rounded-xl hover:bg-gray-100" title="ملف الطالب"><i className="fa-solid fa-id-card"></i></button>
                                <button onClick={() => onChat({ id: r.studentId, fullName: r.studentName })} className="bg-white border text-indigo-600 w-10 h-10 rounded-xl hover:bg-indigo-50" title="مراسلة"><i className="fa-solid fa-comment-dots"></i></button>
                                {r.status === "pending" && <>
                                    <button onClick={() => approve(r)} className="bg-primary text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow hover:bg-indigo-700">تفعيل ✅</button>
                                    <button onClick={() => reject(r)} className="bg-red-100 text-red-600 px-5 py-2.5 rounded-xl font-bold text-sm hover:bg-red-200">رفض</button>
                                </>}
                                {r.status === "approved" && <>
                                    <span className="bg-green-100 text-green-700 px-4 py-2.5 rounded-xl font-black text-sm"><i className="fa-solid fa-check ml-1"></i>مفعّل</span>
                                    <button onClick={() => revoke(r)} className="bg-white border border-red-200 text-red-500 px-4 py-2.5 rounded-xl font-bold text-sm hover:bg-red-50">إلغاء الاشتراك</button>
                                </>}
                                {r.status === "rejected" && <button onClick={() => remove(r)} className="bg-white border text-gray-400 w-10 h-10 rounded-xl hover:text-red-500"><i className="fa-solid fa-trash"></i></button>}
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );
    }

            getDoc(doc(db, "users", student.id)).then((d) => d.exists() && setData({ id: d.id, ...d.data() }));

                    <h3 className="text-2xl font-black">{data.fullName || data.username || "طالب"}</h3>
                    {data.username && <p className="text-xs font-bold mt-1 bg-white/20 inline-block px-3 py-1 rounded-full" dir="ltr">@{data.username}</p>}

                            <div key={l} className="flex justify-between border-b border-gray-100 pb-2 last:border-0 last:pb-0"><span className="text-gray-500 font-bold"><i className={`fa-solid ${ic} w-5 text-primary`}></i>{l}</span><span className="font-bold text-gray-800">{v || "—"}</span></div>

                        <div className="flex justify-between"><span className="text-gray-500 font-bold"><i className="fa-solid fa-phone w-5 text-green-500"></i>الجوال</span><span className="font-bold" dir="ltr">{data.phone || "—"}</span></div>

                    <div>
                        <h4 className="font-black text-gray-800 mb-3">الدورات المشترك بها ({enrolled.length})</h4>

    function AdminSupportChats({ students, chatMeta, preselected }) {
        const [selected, setSelected] = useState(preselected || null);
        const [messages, setMessages] = useState([]);
        const [reply, setReply] = useState("");
        const [search, setSearch] = useState("");
        const endRef = useRef(null);
        const metaMap = useMemo(() => Object.fromEntries(chatMeta.map((m) => [m.id, m])), [chatMeta]);

        const list = students
            .filter((s) => (s.fullName || s.username || "").includes(search.trim()))
            .sort((a, b) => String(metaMap[b.id]?.updatedAt || "").localeCompare(String(metaMap[a.id]?.updatedAt || "")));

        useEffect(() => {
            if (!selected) return;
            return onSnapshot(query(collection(db, "users", selected.id, "supportChat"), orderBy("createdAt", "asc")), (s) => {
                setMessages(s.docs.map((d) => ({ id: d.id, ...d.data() })));
                setTimeout(() => endRef.current?.scrollIntoView({ behavior: "smooth" }), 80);
            }, () => {});
        }, [selected?.id]);

        useEffect(() => {
            if (selected && metaMap[selected.id]?.unreadAdmin) setDoc(doc(db, "chatMeta", selected.id), { unreadAdmin: false }, { merge: true });
        }, [selected?.id, metaMap[selected?.id]?.unreadAdmin]);

        const send = async (e) => {
            e.preventDefault();
            const t = reply.trim(); if (!t || !selected) return;
            setReply("");
            await addDoc(collection(db, "users", selected.id, "supportChat"), { sender: "admin", text: t, createdAt: nowISO() });
            await setDoc(doc(db, "chatMeta", selected.id), { lastText: t, lastSender: "admin", updatedAt: nowISO(), unreadStudent: true, unreadAdmin: false }, { merge: true });
        };

        return (
            <div className="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden flex flex-col md:flex-row h-[78vh]">
                <div className={`w-full md:w-80 bg-slate-50 border-l border-gray-100 flex-col ${selected ? "hidden md:flex" : "flex"}`}>
                    <div className="p-4 border-b border-gray-200 bg-white space-y-3">
                        <h3 className="font-black text-gray-800"><i className="fa-solid fa-comments text-primary ml-2"></i>المحادثات</h3>
                        <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="بحث..." className={inputCls} />
                    </div>
                    <div className="flex-1 overflow-y-auto p-3 space-y-2">
                        {list.map((st) => {
                            const m = metaMap[st.id];
                            const active = selected?.id === st.id;
                            return (
                                <button key={st.id} onClick={() => setSelected(st)} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all text-right ${active ? "bg-primary text-white shadow-md" : "bg-white hover:bg-gray-100 border border-gray-100"}`}>
                                    <div className={`w-9 h-9 shrink-0 rounded-full flex items-center justify-center font-black ${active ? "bg-white/20" : "bg-gray-200 text-gray-500"}`}>{(st.fullName || st.username || "?").charAt(0)}</div>
                                    <div className="min-w-0 flex-1">
                                        <p className="font-bold text-sm truncate">{st.fullName || st.username}</p>
                                        {m?.lastText && <p className={`text-xs truncate ${active ? "text-indigo-100" : "text-gray-400"}`}>{m.lastSender === "admin" ? "أنت: " : ""}{m.lastText}</p>}
                                    </div>
                                    {m?.unreadAdmin && !active && <span className="w-3 h-3 bg-red-500 rounded-full shrink-0"></span>}
                                </button>
                            );
                        })}
                    </div>
                </div>
                <div className={`flex-1 flex-col bg-white ${selected ? "flex" : "hidden md:flex"}`}>
                    {selected ? <>
                        <div className="p-4 border-b border-gray-100 flex items-center gap-3">
                            <button onClick={() => setSelected(null)} className="md:hidden w-9 h-9 rounded-full bg-gray-100"><i className="fa-solid fa-arrow-right"></i></button>
                            <div className="w-10 h-10 bg-indigo-100 text-primary rounded-full flex items-center justify-center"><i className="fa-solid fa-user-graduate"></i></div>
                            <h3 className="font-black text-gray-800">{selected.fullName || selected.username}</h3>
                        </div>
                        <div className="flex-1 overflow-y-auto p-5 space-y-3 bg-slate-50/50">
                            {messages.length === 0 && <div className="h-full flex flex-col items-center justify-center text-gray-400"><i className="fa-regular fa-comments text-5xl mb-3 opacity-20"></i><p className="font-bold">ابدأ المحادثة الآن</p></div>}
                            {messages.map((m) => (
                                <div key={m.id} className={`flex ${m.sender === "admin" ? "justify-start" : "justify-end"}`}>
                                    <div className={`p-3.5 rounded-2xl max-w-[75%] shadow-sm text-sm whitespace-pre-wrap ${m.sender === "admin" ? "bg-primary text-white rounded-tr-sm" : "bg-white text-gray-800 border border-gray-100 rounded-tl-sm"}`}>
                                        {m.text}
                                        <span className={`block text-[9px] mt-1.5 font-bold ${m.sender === "admin" ? "text-indigo-200" : "text-gray-400"}`}>{fmtTime(m.createdAt)}</span>
                                    </div>
                                </div>
                            ))}
                            <div ref={endRef}></div>
                        </div>
                        <form onSubmit={send} className="p-3 bg-white border-t border-gray-100 flex gap-2">
                            <input value={reply} onChange={(e) => setReply(e.target.value)} placeholder="اكتب رسالة للطالب..." className={inputCls + " rounded-full"} />
                            <button type="submit" disabled={!reply.trim()} className="bg-primary text-white w-11 h-11 shrink-0 rounded-full shadow-lg hover:bg-indigo-700 disabled:opacity-50"><i className="fa-solid fa-paper-plane"></i></button>
                        </form>
                    </> : (
                        <div className="flex-1 flex flex-col items-center justify-center text-gray-300">
                            <i className="fa-brands fa-rocketchat text-7xl mb-4 opacity-20"></i>
                            <p className="font-black text-xl text-gray-400">اختر طالباً لبدء المحادثة</p>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    function AdminPromos({ promos }) {
        const empty = { title: "", type: "image", url: "", text: "" };
        const [form, setForm] = useState(empty);
        const [editing, setEditing] = useState(null);
        const add = async (e) => {
            e.preventDefault();
            if (form.type === "image" && !form.url) { toast("اختر صورة الإعلان", "error"); return; }
            await addDoc(collection(db, "promos"), { title: form.title, type: form.type, url: form.type !== "text" ? form.url : "", text: form.type === "text" ? form.text : "", createdAt: nowISO() });
            setForm(empty); toast("تم نشر الإعلان");
        };
        const save = async (e) => {
            e.preventDefault();
            const { id, ...rest } = editing;
            await updateDoc(doc(db, "promos", id), rest);
            setEditing(null); toast("تم حفظ الإعلان");
        };
        const PromoFields = ({ v, set }) => <>
            <Field label="عنوان الإعلان"><input required value={v.title} onChange={(e) => set({ ...v, title: e.target.value })} className={inputCls} /></Field>
            <Field label="النوع">
                <select value={v.type} onChange={(e) => set({ ...v, type: e.target.value, url: "" })} className={inputCls}>
                    <option value="image">صورة إعلانية</option><option value="video">فيديو يوتيوب</option><option value="text">نص إعلاني</option>
                </select>
            </Field>
            {v.type === "image" ? <ImagePicker value={v.url} onChange={(url) => set({ ...v, url })} />
                : v.type === "video" ? <input type="url" placeholder="رابط يوتيوب" required value={v.url} onChange={(e) => set({ ...v, url: e.target.value })} className={inputCls} dir="ltr" />
                : <textarea placeholder="النص الإعلاني..." required value={v.text} onChange={(e) => set({ ...v, text: e.target.value })} className={inputCls + " h-24"}></textarea>}
